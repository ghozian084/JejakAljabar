/* =====================================================================
   KODE SIMPAN — memindahkan kemajuan antar perangkat
   Bukan enkripsi. Tujuannya memindahkan, bukan mengamankan: siswa bisa
   memotretnya, menuliskannya, atau mengirimnya lewat WhatsApp, lalu
   menempelkannya di HP lain.

   Alfabet Crockford (tanpa I, L, O, U) supaya salah baca tulisan tangan
   tidak menghasilkan kode lain yang kebetulan sah. Checksum dua karakter
   bergaya Fletcher — menangkap salah ketik satu karakter maupun dua
   karakter yang tertukar posisinya.
   ===================================================================== */
const B32S = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";

function BitTulis(){ this.b = []; }
BitTulis.prototype.put = function(v, n){
  v = Math.max(0, Math.min(Math.floor(v) || 0, Math.pow(2, n) - 1));
  for(let i = n - 1; i >= 0; i--) this.b.push(Math.floor(v / Math.pow(2, i)) % 2);
  return this;
};
BitTulis.prototype.selesai = function(awalan){
  const b = this.b.slice();
  while(b.length % 5) b.push(0);
  let s = "";
  for(let i = 0; i < b.length; i += 5){
    let v = 0;
    for(let j = 0; j < 5; j++) v = v * 2 + b[i + j];
    s += B32S[v];
  }
  let c1 = 0, c2 = 0;
  for(let i = 0; i < s.length; i++){ c1 = (c1 + B32S.indexOf(s[i])) % 32; c2 = (c2 + c1) % 32; }
  s += B32S[c1] + B32S[c2];
  return awalan + "-" + (s.match(/.{1,5}/g) || []).join("-");
};

function BitBaca(teks, awalan){
  let t = String(teks).toUpperCase().replace(/[^0-9A-Z]/g, "");
  if(t.indexOf(awalan) !== 0) return null;
  t = t.slice(awalan.length).replace(/[IL]/g, "1").replace(/O/g, "0").replace(/U/g, "V");
  if(t.length < 4) return null;
  const isi = t.slice(0, -2), cs = t.slice(-2);
  if(isi.split("").some(c => B32S.indexOf(c) < 0)) return null;
  let c1 = 0, c2 = 0;
  for(let i = 0; i < isi.length; i++){ c1 = (c1 + B32S.indexOf(isi[i])) % 32; c2 = (c2 + c1) % 32; }
  if(B32S[c1] + B32S[c2] !== cs) return null;               // checksum gagal
  const bits = [];
  for(let i = 0; i < isi.length; i++){
    const v = B32S.indexOf(isi[i]);
    for(let j = 4; j >= 0; j--) bits.push(Math.floor(v / Math.pow(2, j)) % 2);
  }
  let pos = 0;
  return { get:function(n){
    let v = 0;
    for(let i = 0; i < n; i++) v = v * 2 + (bits[pos++] || 0);
    return v;
  } };
}

const HURUF26 = "abcdefghijklmnopqrstuvwxyz";
/* =====================================================================
   KARTU LAPANGAN — membawa jejak Modul 2 ke Panel Guru lewat gambar
   Foto tidak muat di dalam KODE JEJAK, jadi arahnya dibalik: datanya yang
   dititipkan ke dalam gambar. Di bawah kartu ada pita kotak hitam-putih
   yang isinya sandi KODE SIMPAN biasa (BitTulis/BitBaca, checksum yang
   sama), satu sel per bit.

   Kenapa kotak besar, bukan metadata PNG: WhatsApp memampatkan foto ke
   JPEG dan membuang metadata. Sel 18 px hitam pekat di atas putih tetap
   terbaca walau gambarnya dipampatkan atau diperkecil separuh.

   Cuplikan ini DISALIN ke ar-ukur.html (menulis) dan partC.html
   (membaca), bukan ditaut. Uji memastikan ketiga salinan sama persis.
   Membutuhkan BitTulis/BitBaca dari kodesimpan.js.

   Riwayat format:
     v1  110 bit, tata "lama"  — jejak pindaian
     v2  115 bit, tata "lama"  — + menit kerja (5 bit)
     v3  118 bit, tata "soal"  — + soal buatan siswa (3 bit)
   Sandi dibentuk per 5 bit, jadi 118 bit = 24 simbol + 2 checksum = 130
   sel — tidak muat di pita 4 baris (128 sel). Karena itu v3 memakai kartu
   yang lebih tinggi dengan pita 5 baris (160 sel; sisa 6 simbol).
   Tata letak dikenali dari RASIO gambar, jadi kartu lama tetap terbaca.
   ===================================================================== */
const KARTU = {
  W:720, SEL:18, KOL:33, PX:63,  // kolom 0 = sel acuan, kolom 1–32 = data
  TATA:{
    lama:{ H:1040, PY:924,  BAR:4, versi:[1, 2] },
    soal:{ H:1210, PY:1076, BAR:5, versi:[3] }
  },
  AWALAN:"KL2", TANDA:167, VERSI:3,
  SIMBOL:{ 1:24, 2:25, 3:26 },   // panjang sandi per versi, termasuk checksum
  BATAS_MENIT:20                 // waktu kerja lapangan; Modul 2 dan Panel Guru sepakat di sini
};
KARTU.SEKARANG = KARTU.TATA.soal;  // tata letak yang ditulis Modul 2
KARTU.H = KARTU.SEKARANG.H;
const KARTU_LANGKAH = ["cScan","cModel","cMeasure","cSub"];
const KARTU_SOAL = ["", "maju", "mundur", "perubahan"];   // indeks = nilai 2 bit di pita

function kartuSandi(d){
  const w = new BitTulis();
  w.put(KARTU.TANDA, 8).put(KARTU.VERSI, 4).put(d.id, 20);
  KARTU_LANGKAH.forEach(function(k){ w.put(d.selesai[k] ? 1 : 0, 1); });
  w.put(Math.round(d.rasio * 100), 11).put(Math.round(d.miring * 100), 7);
  w.put(Math.round(d.p * 10), 14).put(Math.round(d.l * 10), 14);
  w.put(d.statusUkur, 2).put(d.ukurUlang, 4);
  w.put(d.kDua, 3).put(d.kLuas, 3).put(d.kLain, 3);
  w.put(d.digeser ? 1 : 0, 1).put(d.hari, 12);
  // waktu: 0 = penghitung tidak dipakai; 1–31 = menit + 1 (31 berarti 30 menit atau lebih)
  w.put(d.waktu === null || d.waktu === undefined ? 0 : Math.min(31, d.waktu + 1), 5);
  // soal: jenis (0 = belum membuat) dan apakah kunci jawabannya konsisten dengan model
  w.put(Math.max(0, KARTU_SOAL.indexOf(d.soal || "")), 2).put(d.soalOk ? 1 : 0, 1);
  // "KL2-XXXXX-…" → deretan simbol saja; awalan tidak ikut digambar
  return w.selesai(KARTU.AWALAN).slice(KARTU.AWALAN.length).replace(/-/g, "");
}
function kartuBacaSandi(simbol){
  const r = BitBaca(KARTU.AWALAN + simbol, KARTU.AWALAN);
  if(!r) return null;
  if(r.get(8) !== KARTU.TANDA) return null;
  const versi = r.get(4);
  if(versi < 1 || versi > KARTU.VERSI) return "versi";
  /* Versi yang terbaca harus cocok dengan panjang potongannya. Tanpa ini,
     kartu v2 yang dipotong ke panjang v1 bisa lolos checksum secara
     kebetulan (1 dari 1024) lalu terbaca dengan bit waktu yang hilang. */
  if(KARTU.SIMBOL[versi] !== simbol.length) return null;
  const d = { versi:versi, id:r.get(20), selesai:{} };
  KARTU_LANGKAH.forEach(function(k){ d.selesai[k] = !!r.get(1); });
  d.rasio = r.get(11) / 100; d.miring = r.get(7) / 100;
  d.p = r.get(14) / 10; d.l = r.get(14) / 10;
  d.statusUkur = r.get(2); d.ukurUlang = r.get(4);
  d.kDua = r.get(3); d.kLuas = r.get(3); d.kLain = r.get(3);
  d.digeser = !!r.get(1); d.hari = r.get(12);
  d.waktu = null; d.soal = ""; d.soalOk = false;
  if(versi >= 2){ const t = r.get(5); d.waktu = t === 0 ? null : t - 1; }
  if(versi >= 3){ d.soal = KARTU_SOAL[r.get(2)]; d.soalOk = !!r.get(1); }
  return d;
}

/* Kolom acuan berselang hitam-putih: pembaca mengambil ambang dari sini,
   bukan dari angka tetap, karena kecerahan JPEG hasil pampatan bergeser. */
function kartuGambarPita(x, simbol, tata){
  tata = tata || KARTU.SEKARANG;
  const S = KARTU.SEL, lebar = KARTU.KOL * S, tinggi = tata.BAR * S;
  x.fillStyle = "#000";
  x.fillRect(KARTU.PX - 2*S, tata.PY - 2*S, lebar + 4*S, tinggi + 4*S);
  x.fillStyle = "#fff";
  x.fillRect(KARTU.PX - S, tata.PY - S, lebar + 2*S, tinggi + 2*S);
  const bit = [];
  for(let i = 0; i < simbol.length; i++){
    const v = B32S.indexOf(simbol[i]);
    for(let j = 4; j >= 0; j--) bit.push(Math.floor(v / Math.pow(2, j)) % 2);
  }
  x.fillStyle = "#000";
  for(let b = 0; b < tata.BAR; b++){
    if(b % 2 === 0) x.fillRect(KARTU.PX, tata.PY + b*S, S, S);
    for(let k = 1; k < KARTU.KOL; k++){
      const i = b * (KARTU.KOL - 1) + (k - 1);
      if(bit[i]) x.fillRect(KARTU.PX + k*S, tata.PY + b*S, S, S);
    }
  }
}

/* sumber: Image/canvas apa pun. Hasil: {d} atau {alasan}. */
function kartuBacaGambar(sumber){
  const w = sumber.naturalWidth || sumber.width, h = sumber.naturalHeight || sumber.height;
  if(!w || !h) return { alasan:"kosong" };
  let tata = null;
  for(const n in KARTU.TATA){
    const minta = KARTU.W / KARTU.TATA[n].H;
    if(Math.abs(w / h - minta) / minta <= 0.03) tata = KARTU.TATA[n];
  }
  if(!tata) return { alasan:"rasio" };
  const c = document.createElement("canvas");
  c.width = KARTU.W; c.height = tata.H;
  const x = c.getContext("2d", {willReadFrequently:true});
  x.drawImage(sumber, 0, 0, KARTU.W, tata.H);
  const S = KARTU.SEL;
  const piksel = x.getImageData(KARTU.PX, tata.PY, KARTU.KOL * S, tata.BAR * S);
  // rata-rata kecerahan separuh tengah sel — tepi sel kabur karena pampatan
  function terang(k, b){
    let jml = 0, n = 0;
    for(let yy = Math.round(S*.25); yy < Math.round(S*.75); yy++)
      for(let xx = Math.round(S*.25); xx < Math.round(S*.75); xx++){
        const o = ((b*S + yy) * piksel.width + (k*S + xx)) * 4;
        jml += piksel.data[o]*.299 + piksel.data[o+1]*.587 + piksel.data[o+2]*.114; n++;
      }
    return jml / n;
  }
  // Dihitung terpisah: dengan 5 baris ada 3 sel acuan hitam dan 2 putih.
  let hitam = 0, putih = 0, nh = 0, np = 0;
  for(let b = 0; b < tata.BAR; b++){
    if(b % 2 === 0){ hitam += terang(0, b); nh++; } else { putih += terang(0, b); np++; }
  }
  hitam /= nh; putih /= np;
  if(putih - hitam < 80) return { alasan:"kontras" };
  const ambang = (hitam + putih) / 2, bit = [];
  for(let b = 0; b < tata.BAR; b++)
    for(let k = 1; k < KARTU.KOL; k++) bit.push(terang(k, b) < ambang ? 1 : 0);
  let simbol = "";
  for(let i = 0; i + 5 <= bit.length; i += 5){
    let v = 0;
    for(let j = 0; j < 5; j++) v = v * 2 + bit[i + j];
    simbol += B32S[v];
  }
  /* Panjang sandi tetap per versi, jadi bisa dipotong pasti tanpa penanda
     akhir. Setiap versi milik tata letak ini dicoba; kartu lama tetap
     terbaca. "versi" hanya untuk kartu yang LEBIH BARU dari pembaca ini. */
  let versiBaru = false;
  for(const v of tata.versi){
    const d = kartuBacaSandi(simbol.slice(0, KARTU.SIMBOL[v]));
    if(d === "versi") versiBaru = true;
    else if(d) return { d:d };
  }
  // Versi mendatang bisa lebih panjang: cari sandi sah di panjang yang belum dikenal.
  for(let n = KARTU.SIMBOL[KARTU.VERSI] + 1; n <= simbol.length && !versiBaru; n++)
    if(kartuBacaSandi(simbol.slice(0, n)) === "versi") versiBaru = true;
  return { alasan: versiBaru ? "versi" : "sandi" };
}

const AWALAN_SIMPAN = "SMP1";
function buatKodeSimpan(){
  const w = new BitTulis();
  w.put(1, 4);                                              // versi tata letak
  w.put(Math.max(0, HURUF26.indexOf(S.letter)), 5);
  w.put(S.q11ok ? 1 : 0, 1);
  w.put(G.openAll ? 1 : 0, 1);
  w.put(G.xp, 12);
  KEY_ITEMS.forEach(k => w.put(S.done[k] ? 1 : 0, 1));      // 10 bit
  ORDER.forEach(c => w.put({flag:1, work:2, clear:3}[S.flags[c]] || 0, 2));
  ORDER.forEach(c => w.put(G.seenBangkit[c] ? 1 : 0, 1));
  BADGES.forEach(b => w.put(G.badges[b.id] ? 1 : 0, 1));    // 13 bit
  return w.selesai(AWALAN_SIMPAN);
}
function pakaiKodeSimpan(teks){
  const r = BitBaca(teks, AWALAN_SIMPAN);
  if(!r) return "gagal";
  if(r.get(4) !== 1) return "versi";
  S.letter = HURUF26[r.get(5)] || "n";
  S.q11ok = !!r.get(1);
  G.openAll = !!r.get(1);
  G.xp = r.get(12);
  S.done = {}; KEY_ITEMS.forEach(k => { if(r.get(1)) S.done[k] = true; });
  S.flags = {};
  ORDER.forEach(c => { const v = r.get(2); if(v) S.flags[c] = ["", "flag", "work", "clear"][v]; });
  G.seenBangkit = {}; ORDER.forEach(c => { if(r.get(1)) G.seenBangkit[c] = true; });
  G.badges = {}; BADGES.forEach(b => { if(r.get(1)) G.badges[b.id] = true; });
  return "ok";
}

const LEVELS = [ [0,tandai("Penjelajah Baru")], [45,tandai("Penjelajah")], [95,tandai("Perintis Jejak")], [155,tandai("Ahli Jejak")] ];
function levelName(xp){
  let n = LEVELS[0][1];
  LEVELS.forEach(([t, l]) => { if(xp >= t) n = l; });
  return n;
}
/* Satu kejadian = satu pesan. Kalau poin dan lencana jatuh bersamaan,
   keduanya digabung — tumpukan notifikasi menutupi isi dan justru
   mengalihkan perhatian dari umpan balik yang sedang dibaca siswa. */
function toast(kind, title, desc, medal){
  const w = document.getElementById("toastWrap"); if(!w) return;
  while(w.children.length >= 3) w.firstChild.remove();
  const d = document.createElement("div");
  d.className = "toast " + kind;
  d.innerHTML = '<span class="medal">' + medal + '</span><div><div class="tt">' + title +
    '</div><div class="td">' + desc + "</div></div>";
  w.appendChild(d);
  requestAnimationFrame(() => d.classList.add("in"));
  setTimeout(() => { d.classList.remove("in"); setTimeout(() => d.remove(), 380); }, 3000);
}
function addXp(n, why, diam){
  if(n <= 0) return 0;
  const before = levelName(G.xp);
  G.xp += n;
  renderGame();
  const after = levelName(G.xp);
  if(after !== before){ toast("xp", terj("Peringkat naik: {lv}", {lv:terj(after)}), terj("Terkumpul {n} jejak.", {n:G.xp}), "★"); return n; }
  if(!diam) toast("xp", terj("+{n} jejak", {n:n}), why, "+");
  return n;
}
function grant(id, extra){
  if(G.badges[id]) return false;
  const b = BADGES.find(x => x.id === id); if(!b) return false;
  G.badges[id] = true;
  renderGame();
  toast("", terj("Lencana: {n}", {n:terj(b.n)}), terj(b.d) + (extra ? " · " + terj("+{n} jejak", {n:extra}) : ""), terj(b.n)[0]);
  return true;
}
function renderGame(){
  const el = id => document.getElementById(id);
  const lv = levelName(G.xp), got = Object.keys(G.badges).length;
  if(el("xpVal")) el("xpVal").textContent = G.xp;
  if(el("xpLv"))  el("xpLv").textContent = terj(lv);
  if(el("pjXp"))  el("pjXp").textContent = G.xp;
  if(el("pjLv"))  el("pjLv").textContent = terj(lv);
  if(el("pjBadge")) el("pjBadge").textContent = got + "/" + BADGES.length;
  const grid = el("badgeGrid");
  if(grid) grid.innerHTML = BADGES.map(b => {
    const has = !!G.badges[b.id];
    return '<div class="badge ' + (has ? "got" : "locked") + '"><span class="m">' +
      (has ? terj(b.n)[0] : "?") + '</span><div><div class="n">' + terj(b.n) +
      '</div><div class="d">' + terj(b.d) + "</div></div></div>";
  }).join("");
}

function mark(code, level){
  const rank = {flag:1, work:2, clear:3};
  const cur = S.flags[code];
  if(!cur){ S.flags[code] = level; }
  else if(level === "flag"){ S.flags[code] = "flag"; }          // temuan baru selalu menang
  else if(rank[level] > rank[cur] && cur !== "flag"){ S.flags[code] = level; }
  else if(cur === "flag" && level === "clear"){ S.flags[code] = "work"; } // sempat salah lalu benar
  renderMap();
  /* Meluruskan salah paham yang sempat dipegang — inilah yang paling
     ingin dihargai media ini, jadi ia berdiri sendiri sebagai hadiah. */
  if(S.flags[code] === "work" && !G.seenBangkit[code]){
    G.seenBangkit[code] = true;
    const baruLencana = !G.badges.bangkit;
    addXp(XP_BANGKIT, terj("Kamu meluruskan sendiri {kode} yang tadi sempat kamu pegang.", {kode:code}), baruLencana);
    if(!grant("bangkit", XP_BANGKIT) && false){ /* pesan sudah keluar lewat addXp */ }
  }
  if(ORDER.every(c => S.flags[c] && S.flags[c] !== "flag")) grant("bersih");
}
function complete(id){
  const baru = !S.done[id];
  setTimeout(simpan, 0);
  S.done[id] = true;
  renderProgress();
  if(!baru) return;
  const pernahKeliru = LOG.some(r => r.id === id && r.kind === "bad") ||
                       (id === "scale" && SC.trapped);
  const dasar = (XP_ITEM[id] || 10) + (pernahKeliru ? XP_PULIH : 0);
  const b = BADGES.find(x => x.on === id);
  const adaLencana = b && !G.badges[b.id];
  addXp(dasar,
        pernahKeliru ? terj("Selesai setelah kamu perbaiki sendiri — ini yang dibayar paling mahal.")
                     : terj("Kegiatan selesai."),
        adaLencana);                                   // digabung ke pesan lencana
  if(b) grant(b.id, dasar);
  if(id === "scale" && SC.trapped) grant("jebakan");
}

/* ---------- 3. MESIN ALJABAR ----------------------------------------
   Pengecekan dilakukan secara NUMERIK di banyak titik uji, bukan dengan
   mencocokkan string. Akibatnya 2(p+2) dan 2p+4 sama-sama diterima.   */
function prep(raw){
  if(raw == null) return "";
  let t = String(raw).toLowerCase().trim();
  t = t.replace(/\s+/g,"").replace(/,/g,".");
  t = t.replace(/[×·✕]/g,"*").replace(/[÷:]/g,"/").replace(/[–—−]/g,"-");
  t = t.replace(/\^/g,"**");
  t = t.replace(/(\d)(?=[a-z(])/g,"$1*");     // 3n -> 3*n ; 2( -> 2*(
  t = t.replace(/\)(?=[\da-z(])/g,")*");      // )( -> )*(
  t = t.replace(/([a-z])(?=\()/g,"$1*");      // n( -> n*(
  t = t.replace(/([a-z])(?=[a-z])/g,"$1*");   // ab -> a*b
  return t;
}
const SAFE = /^[0-9a-z+\-*/().]*$/;

/* Huruf mana saja yang dipakai siswa, di luar yang seharusnya.

   Dipakai untuk membedakan dua hal yang selama ini tercampur: siswa yang
   salah memodelkan, dan siswa yang memodelkan dengan benar tetapi memakai
   huruf lain. Keduanya sebelumnya jatuh ke pesan "belum cocok" yang sama,
   sehingga siswa yang benar dituduh keliru. Dalam pemodelan matematika
   huruf itu bebas; yang tidak bebas adalah strukturnya. Memaksa satu huruf
   tertentu justru menanamkan M1 — huruf diperlakukan sebagai label tetap. */
function hurufAsing(raw, sah){
  const t = prep(raw);
  if(!t || !SAFE.test(t)) return null;
  const set = {}, sahSet = {};
  (sah || []).forEach(n => { String(n).split("").forEach(c => sahSet[c] = 1); });
  (t.match(/[a-z]/g) || []).forEach(c => { if(!sahSet[c]) set[c] = 1; });
  const k = Object.keys(set);
  return k.length ? k : null;
}
/* Menukar huruf asing menjadi huruf yang sah, hanya kalau siswa memakai
   TEPAT SATU huruf lain secara konsisten. Dua huruf berbeda berarti dua
   besaran tak diketahui — itu memang keliru dan harus tetap dinilai keliru. */
function samakanHuruf(raw, ke){
  const a = hurufAsing(raw, [ke]);
  if(!a || a.length !== 1) return null;
  return { teks: String(raw).toLowerCase().replace(new RegExp(a[0], "g"), ke), dari: a[0] };
}

/* Penilai ekspresi ditulis sendiri (tokenizer + recursive descent).
   TIDAK memakai eval / new Function — supaya media tetap hidup di dalam
   iframe atau halaman ber-Content-Security-Policy ketat, yang justru
   lazim dipakai LMS sekolah dan panel pratinjau. */
function tokenize(src){
  const out = []; let i = 0;
  while(i < src.length){
    const c = src[i];
    if(c === " "){ i++; continue; }
    if(c >= "0" && c <= "9" || c === "."){
      let j = i; while(j < src.length && (src[j] >= "0" && src[j] <= "9" || src[j] === ".")) j++;
      const v = parseFloat(src.slice(i, j));
      if(isNaN(v)) return null;
      out.push({t:"num", v:v}); i = j; continue;
    }
    if(c >= "a" && c <= "z"){ out.push({t:"var", v:c}); i++; continue; }
    if("+-*/^()".indexOf(c) >= 0){ out.push({t:c}); i++; continue; }
    return null;
  }
  return out;
}
function evalTokens(toks, vals){
  let pos = 0;
  const eat = t => (toks[pos] && toks[pos].t === t) ? (pos++, true) : false;
  function primary(){
    const tk = toks[pos];
    if(!tk) throw 0;
    if(tk.t === "num"){ pos++; return tk.v; }
    if(tk.t === "var"){ pos++; if(!(tk.v in vals)) throw 0; return vals[tk.v]; }
    if(tk.t === "("){ pos++; const v = expr(); if(!eat(")")) throw 0; return v; }
    throw 0;
  }
  function power(){ const b = primary(); return eat("^") ? Math.pow(b, unary()) : b; }
  function unary(){ if(eat("-")) return -unary(); if(eat("+")) return unary(); return power(); }
  function term(){ let v = unary(); for(;;){ if(eat("*")) v *= unary(); else if(eat("/")) v /= unary(); else return v; } }
  function expr(){ let v = term(); for(;;){ if(eat("+")) v += term(); else if(eat("-")) v -= term(); else return v; } }
  const r = expr();
  if(pos !== toks.length) throw 0;
  return r;
}
function evalAt(src, names, vals){
  const toks = tokenize(src);
  if(!toks || !toks.length) return NaN;
  try{
    const r = evalTokens(toks, vals);
    return (typeof r === "number" && isFinite(r)) ? r : NaN;
  }catch(e){ return NaN; }
}
/** Apakah jawaban siswa ekuivalen dengan target, untuk semua nilai uji? */
function equiv(student, target, names){
  const A = prep(student), B = prep(target);
  if(!A || !SAFE.test(A)) return false;
  const pts = [[2,3],[5,7],[11,4],[6,9],[13,2],[8,5],[3,10]];
  let tested = 0;
  for(const p of pts){
    const vals = {};
    names.forEach((n,i) => vals[n] = p[i % p.length] * (i ? 1.7 : 1) + i);
    const a = evalAt(A, names, vals), b = evalAt(B, names, vals);
    if(isNaN(a) || isNaN(b)) continue;
    if(Math.abs(a - b) > 1e-7 * Math.max(1, Math.abs(b))) return false;
    tested++;
  }
  return tested >= 3;
}
function numOf(raw){
  const t = prep(raw);
  if(!t || !SAFE.test(t)) return NaN;
  return evalAt(t, [], {});
}
function fmtNum(x){
  if(!isFinite(x)) return "?";
  if(Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
  return (Math.round(x * 100) / 100).toString();
}

};

/* --- 1.4 : klasifikasi jawaban terbuka (mesin aturan, offline) --- */
function tokens(t){
  return " " + String(t || "").toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim() + " ";
}
function hasAny(t, list){ return list.some(w => t.indexOf(" " + w + " ") >= 0 || t.indexOf(w) >= 0); }

CHECK.q14 = () => {
  const raw = document.getElementById("q14").value || "";
  if(raw.trim().length < 8){
    say("q14","hint",terj("Tulis minimal satu kalimat utuh — mesin diagnostik butuh alasanmu, bukan satu kata.")); return;
  }
  /* Diagnosis di bawah mencocokkan kata kunci BAHASA INDONESIA. Di bahasa
     lain media DIAM (keputusan penulis): jawaban diterima tanpa kode M dan
     tanpa dicatat di Peta Miskonsepsi, kalimat siswa tetap masuk Lembar
     Kerja untuk dibaca guru, dan siswa diberi tahu alasannya. Lebih baik
     diam daripada menuduh keliru karena kata kuncinya tidak dikenali. */
  if(JEJAK_BHS.kini() !== "id"){
    say("q14","ok",terj("Penjelasanmu tercatat di Lembar Kerja untuk dibaca gurumu.") + '<span class="diag">' +
      terj("Pemeriksaan otomatis jawaban terbuka hanya tersedia dalam bahasa Indonesia, jadi penjelasan ini tidak dinilai.") +
      "</span>");
    complete("q14"); return;
  }
  const t = tokens(raw);
  /* Pertanyaannya sengaja TIDAK berbentuk benar/salah. Versi lama meminta
     siswa menilai pernyataan “3k artinya 3 kotak”, padahal kalimat itu
     ambigu: kalau k = banyak ikan dalam satu kotak, “isi 3 kotak” justru
     bacaan yang benar. Yang dinilai sekarang hanya isi penjelasannya. */
  const adaKali = hasAny(t, ["kali","dikali","perkalian","dikalikan","kelipatan","tiga kali","sebanyak 3","sebanyak tiga"]);
  const adaIsi  = hasAny(t, ["isi","isinya","banyak ikan","banyaknya ikan","jumlah ikan","ikan dalam","ikan di dalam",
                             "dalam kotak","dalam satu kotak","dalam 1 kotak","per kotak","tiap kotak","setiap kotak","satu kotak"]);
  const tigaKotak = hasAny(t, ["3 kotak","tiga kotak"]);
  const adaLabel  = hasAny(t, ["singkatan","nama benda","k artinya kotak","k adalah kotak","k itu kotak",
                               "lambang kotak","huruf kotak"]);

  if(adaLabel && !adaKali && !adaIsi){
    say("q14","bad","Jawabanmu memperlakukan huruf <span class=\"math\">k</span> sebagai singkatan kata “kotak”. " +
      "Kalau begitu <span class=\"math\">3k</span> berarti “kotak, kotak, kotak” — dan itu tidak bisa dihitung. " +
      "Padahal <span class=\"math\">3k</span> punya nilai. Nilai apa?","M1");
    return;
  }
  if(tigaKotak && !adaIsi && !adaKali){
    say("q14","bad","“3 kotak” menyebut <i>wadahnya</i>, bukan <i>bilangannya</i>. Huruf " +
      "<span class=\"math\">k</span> mewakili banyaknya ikan, bukan kotaknya. " +
      "Coba tulis ulang: <span class=\"math\">3k</span> adalah banyaknya … apa?","M1");
    return;
  }
  /* “banyaknya ikan di dalam 3 kotak” sudah benar meski tanpa kata “kali”. */
  if((adaKali && adaIsi) || (tigaKotak && adaIsi)){
    say("q14","ok","Penjelasanmu utuh: kamu menyebut bahwa yang diwakili <span class=\"math\">k</span> adalah " +
      "<b>banyaknya ikan</b> — bukan kotaknya — dan menyebut bahwa angka 3 mengalikannya. " +
      "Itu persis pemahaman yang dituju.");
    mark("M1","clear"); complete("q14"); return;
  }
  if(adaKali && !adaIsi){
    say("q14","hint","Sudah benar bahwa itu perkalian — tapi belum kamu sebutkan <i>apa</i> yang dikalikan tiga. " +
      "3 dikali … apa? Sebutkan bendanya."); return;
  }
  if(adaIsi && !adaKali){
    say("q14","hint","Kamu sudah menyebut isi kotak, bagus. Sekarang lengkapi: apa yang dilakukan angka 3 " +
      "terhadap <span class=\"math\">k</span>?"); return;
  }
  say("q14","hint","Mesin diagnostik belum menemukan alasan yang bisa dibaca. Sebutkan dua hal: " +
    "(1) apa yang diwakili huruf <span class=\"math\">k</span>, dan (2) apa yang dilakukan angka 3 terhadapnya.");
};

/* ---------- 6. POS 2 : NERACA KESETARAAN ----------------------------- */
const SC = { L:{a:3,b:2}, R:{a:0,b:26}, log:[], hist:[], solved:false, trapped:false };
const N_TRUE = 8;

function sideStr(s){
  const a = s.a, b = s.b;
  const av = fmtNum(a), bv = fmtNum(b);
  if(Math.abs(a) < 1e-12) return bv;
  let head = (Math.abs(a - 1) < 1e-12) ? "n" : (Math.abs(a + 1) < 1e-12 ? "-n" : av + "n");
  if(Math.abs(b) < 1e-12) return head;
  return head + (b > 0 ? " + " + bv : " − " + fmtNum(Math.abs(b)));
}
function sideVal(s){ return s.a * N_TRUE + s.b; }

function renderScale(tilt){
  const l = sideStr(SC.L), r = sideStr(SC.R);
  document.getElementById("svgL").textContent = l;
  document.getElementById("svgR").textContent = r;
  document.getElementById("eqL").textContent = l;
  document.getElementById("eqR").textContent = r;
  const beam = document.getElementById("beam");
  let ang = 0;
  if(tilt !== undefined) ang = tilt;
  beam.style.transition = "transform .45s cubic-bezier(.34,1.4,.5,1)";
  beam.style.transformOrigin = "200px 60px";
  beam.style.transform = "rotate(" + ang + "deg)";
  const lg = document.getElementById("oplog");
  lg.innerHTML = SC.log.map(o => '<span class="' + (o.trap ? "trap" : "") + '">' + terj(o.t) + "</span>").join("");
}
function scaleWin(){
  if(SC.solved) return;
  if(Math.abs(SC.L.a - 1) < 1e-9 && Math.abs(SC.L.b) < 1e-9 && Math.abs(SC.R.a) < 1e-9){
    SC.solved = true;
    say("scale","ok",terj("<b>n = {v}.</b> Jadi satu kotak berisi {v} ekor. Perhatikan yang barusan kamu lakukan: kamu tidak pernah " +
      "“memindahkan” apa pun. Kamu menerapkan operasi yang sama pada dua ruas sekaligus, dan neraca tetap seimbang " +
      "di setiap langkah. Itulah satu-satunya alasan langkahmu sah.", {v:fmtNum(SC.R.b)}) +
      (SC.trapped ? "<span class=\"diag\">" + terj("Catatan: kamu sempat memakai jalan pintas “pindah ruas”. " +
        "Hasilnya kebetulan sama, tapi kamu tidak bisa menjelaskan <i>kenapa</i> boleh — dan itu bedanya hafal dengan paham.") + "</span>" : ""));
    mark("M3","clear"); if(!SC.trapped) mark("M4","clear");
    complete("scale");
  }
}
const OPS = {
  sub2:{t:tandai("− 2 kedua ruas"), f:s => ({a:s.a, b:s.b - 2})},
  add2:{t:tandai("+ 2 kedua ruas"), f:s => ({a:s.a, b:s.b + 2})},
  div3:{t:tandai("÷ 3 kedua ruas"), f:s => ({a:s.a/3, b:s.b/3})},
  mul3:{t:tandai("× 3 kedua ruas"), f:s => ({a:s.a*3, b:s.b*3})}
};
document.getElementById("ops").addEventListener("click", e => {
  const btn = e.target.closest("button[data-op]"); if(!btn) return;
  const op = btn.dataset.op;

  if(op === "trapL"){
    const before = JSON.parse(JSON.stringify(SC.L));
    SC.L = {a:SC.L.a, b:SC.L.b - 2};
    SC.log.push({t:tandai("− 2 KIRI saja"), trap:true}); SC.hist.push({t:tandai("− 2 pada ruas KIRI saja"), trap:true});
    const diff = sideVal(SC.L) - sideVal(SC.R);
    renderScale(Math.max(-11, Math.min(11, -diff * 0.9)));
    say("scale","bad",terj("Neraca langsung miring. Kamu mengambil 2 dari satu sisi tanpa mengambil 2 dari sisi lain, " +
      "jadi kedua sisi tidak lagi bernilai sama — persamaannya rusak. Aku kembalikan."),"M3");
    SC.trapped = true;
    setTimeout(() => { SC.L = before; SC.log.pop(); renderScale(0); }, 1700);
    return;
  }
  if(op === "trapMove"){
    SC.L = {a:SC.L.a, b:SC.L.b - 2};
    SC.R = {a:SC.R.a, b:SC.R.b - 2};
    SC.log.push({t:tandai("“pindah ruas”"), trap:true}); SC.hist.push({t:tandai("“pindahkan 2 ke kanan”"), trap:true});
    SC.trapped = true; mark("M4","flag");
    renderScale(0);
    say("scale","hint",terj("Angkanya jadi benar — dan justru itu masalahnya. “Memindahkan lalu mengganti tanda” " +
      "adalah <i>deskripsi</i> tentang apa yang terlihat di kertas, bukan <i>alasan</i> kenapa boleh. " +
      "Yang sebenarnya terjadi: kamu mengurangi 2 dari <b>kedua</b> ruas sekaligus. Tombol “− 2 kedua ruas” " +
      "melakukan hal yang persis sama, dengan alasan yang bisa kamu ucapkan."),"M4");
    scaleWin();
    return;
  }
  const o = OPS[op]; if(!o) return;
  SC.L = o.f(SC.L); SC.R = o.f(SC.R);
  SC.log.push({t:o.t, trap:false}); SC.hist.push({t:o.t, trap:false});
  renderScale(0);
  const el = document.getElementById("fb-scale");
  if(el && !SC.solved) el.className = "fb";
  scaleWin();
});
document.getElementById("resetScale").addEventListener("click", () => {
  SC.L = {a:3,b:2}; SC.R = {a:0,b:26}; SC.log = []; SC.hist = []; SC.solved = false;
  document.getElementById("fb-scale").className = "fb";
  renderScale(0);
});

const B = { topic:"eq", met:{}, turn:0, busy:false, stuck:0, lastHint:null, selesai:false };
const chat = document.getElementById("chat");

function bubble(who, html){
  const d = document.createElement("div");
  d.className = "msg " + who;
  if(who === "sys"){ d.innerHTML = '<div class="bub">' + html + "</div>"; }
  else{
    const av = who === "budi" ? "B" : terj("Aku");
    d.innerHTML = '<div class="av">' + av + '</div><div class="bub">' + html + "</div>";
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  if(who !== "sys") BLOG.push({topic:B.topic, who:who, text:plain(html)});
}
function renderPips(){
  const T = TOPICS[B.topic];
  const pips = document.getElementById("pips").children;
  let n = 0;
  T.concepts.forEach((c,i) => { if(B.met[c.id]){ pips[i].classList.add("on"); n++; } else pips[i].classList.remove("on"); });
  const st = document.getElementById("budistate");
  st.textContent = terj(n === 0 ? "masih keras kepala" : n === 1 ? "mulai goyah" : n === 2 ? "hampir yakin" : "menyerah — kamu berhasil");
  return n;
}
function startTopic(k){
  B.topic = k; B.met = {}; B.turn = 0; B.stuck = 0; B.lastHint = null; B.selesai = false;
  document.getElementById("budiIn").disabled = false;
  document.getElementById("budiSend").disabled = false;
  chat.innerHTML = "";
  const on = "background:var(--ink);color:#fff;border-color:var(--ink)";
  document.getElementById("tEq").style.cssText = k === "eq" ? on : "";
  document.getElementById("tKk").style.cssText = k === "konkat" ? on : "";
  bubble("sys",terj("Budi memegang miskonsepsi <b>{kode} — {nama}</b>. Dia tidak akan berubah pikiran hanya karena " +
    "kamu menulis jawaban benar.", {kode:TOPICS[k].code, nama:terj(TAXO[TOPICS[k].code].name)}));
  bubble("budi", terj(TOPICS[k].open));
  /* Di bahasa selain Indonesia Budi tidak bisa membaca kata-kata argumen
     (kata kuncinya bahasa Indonesia). Siswa diberi tahu, dan dituntun ke
     poin pertama yang harus dijawab — supaya tetap berdebat, bukan menebak. */
  if(budiDiam()){
    bubble("sys",terj("Di bahasa ini Budi tidak menilai kata-katamu — ia menunggu kamu menjawab setiap poinnya. " +
      "Hanya bukti angka yang tetap diperiksa.") + " " + poinBerikut());
  }
  renderPips();
}
function budiDiam(){ return JEJAK_BHS.kini() !== "id"; }
function poinBerikut(){
  const c = TOPICS[B.topic].concepts.find(x => !B.met[x.id]);
  return c ? terj("<b>Poin Budi berikutnya:</b> {hint}", {hint:terj(c.hint)}) : "";
}
/** Deteksi bukti numerik: siswa benar-benar memasukkan angka & menghitung. */
function numericEvidence(text, notOne){
  const nums = (text.match(/\d+([.,]\d+)?/g) || []).map(x => parseFloat(x.replace(",", ".")));
  if(nums.length < 2) return {ok:false};
  /* Nilai yang benar-benar DIPASANG ke variabel — bukan sekadar angka yang
     kebetulan muncul di dalam perhitungan. "n = 1" berbeda dari "2 + 3". */
  const assigned = [];
  const re = /([a-z])\s*(?:=|adalah|nya)\s*(\d+([.,]\d+)?)/gi;
  let m; while((m = re.exec(text)) !== null) assigned.push(parseFloat(m[2].replace(",", ".")));
  if(notOne && assigned.length && assigned.every(v => v === 1 || v === 0)){
    return {ok:false, onlyOne:true};
  }
  return {ok:true};
}
function ruleReply(text){
  const T = TOPICS[B.topic];
  const t = tokens(text);
  let newly = null;
  for(const c of T.concepts){
    if(B.met[c.id]) continue;
    if(c.numeric){
      const ev = numericEvidence(text, c.notOne);
      if(ev.onlyOne){
        return {say:terj("Aku coba n = 1: 2 + 3×1 = 5, dan 5×1 = 5. Sama! Berarti aku benar dong? " +
                    "…atau jangan-jangan n = 1 itu kebetulan? Coba angka lain."), moved:false};
      }
      if(ev.ok){ newly = c; break; }
    }else if(budiDiam()){ newly = c; break; }     // tidak dinilai: satu poin per giliran
    else if(hasAny(t, c.words)){ newly = c; break; }
  }
  if(newly){
    B.met[newly.id] = true;
    return {say:terj(newly.reply), moved:true, newly:newly};
  }
  /* Dorongan dirotasi, bukan dipatok ke elemen terakhir. Versi lama
     mengulang kalimat yang sama persis tanpa henti begitu B.turn lewat
     panjang daftar — dan itu membuat Budi terlihat rusak, bukan keras kepala. */
  const p = T.push[(B.turn - 1 + T.push.length) % T.push.length];
  return {say:terj(p), moved:false, newly:null};
}
async function llmReply(text){
  const key = (document.getElementById("apiKey").value || "").trim();
  const T = TOPICS[B.topic];
  const sys = [
    "Kamu adalah BUDI, siswa SMP kelas 8 di Semarang. Kamu BUKAN asisten dan BUKAN guru.",
    "Kamu memegang miskonsepsi berikut dan mempercayainya: " + TAXO[T.code].name + " — " + TAXO[T.code].ex + ".",
    "ATURAN MUTLAK:",
    "1. JANGAN PERNAH memberi jawaban akhir, rumus jadi, atau langkah penyelesaian. Kamu tidak tahu jawabannya.",
    "2. Kamu hanya berubah pikiran jika lawan bicara memberi alasan struktural atau bukti angka yang benar.",
    "3. Kalau alasannya lemah, bantah balik dengan sopan dan ajukan satu pertanyaan lanjutan.",
    "4. Bahasa Indonesia santai khas remaja, maksimal 3 kalimat.",
    "5. Kalau kamu benar-benar yakin, akhiri dengan kalimat yang memuat kata BERHASIL."
  ].join("\n");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({
      model:(document.getElementById("apiModel") && document.getElementById("apiModel").value) || "claude-sonnet-4-5",
      max_tokens:300,
      system:sys,
      messages:[{role:"user", content:"Pernyataan awalmu: " + T.open + "\n\nLawan bicara menjawab: " + text}]
    })
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  return (j.content || []).map(c => c.text || "").join(" ").trim();
}
async function budiSend(){
  if(B.busy) return;
  const box = document.getElementById("budiIn");
  const text = (box.value || "").trim();
  if(text.length < 5){ bubble("sys",terj("Tulis argumen yang lebih panjang — Budi tidak bisa dibujuk dengan satu kata.")); return; }
  bubble("me", text.replace(/</g,"&lt;"));
  box.value = ""; B.busy = true; B.turn++;

  // Model bahasa hanya dipakai dalam bahasa Indonesia: instruksinya meminta Budi berbahasa Indonesia.
  const key = budiDiam() ? "" : (document.getElementById("apiKey").value || "").trim();
  let out = null;
  if(key){
    try{
      out = await llmReply(text);
      if(out && /berhasil/i.test(out)){ TOPICS[B.topic].concepts.forEach(c => B.met[c.id] = true); }
    }catch(e){
      bubble("sys",terj("Model bahasa tidak bisa dihubungi ({e}). Budi otomatis kembali ke mesin aturan offline — media tetap berjalan.", {e:e.message}));
      out = null;
    }
  }
  let maju = false;
  if(!out){
    const r = ruleReply(text);
    out = r.say; maju = r.moved;
  }else maju = true;
  bubble("budi", out);

  const n = renderPips();
  const T = TOPICS[B.topic];

  if(maju && n < T.concepts.length){
    B.stuck = 0;
    bubble("sys",terj("Budi menerima poin itu — <b>{n} dari {t}</b> hal sudah ia terima. Masih ada yang mengganjal.",
      {n:n, t:T.concepts.length}) + (budiDiam() ? " " + poinBerikut() : ""));
  }else if(!maju && n < T.concepts.length){
    /* Kalau dua giliran berturut-turut tidak ada kemajuan, Budi sendiri yang
       menawarkan petunjuk. Membiarkan siswa mentok berulang kali tanpa jalan
       keluar adalah cara tercepat membuatnya menyerah. */
    B.stuck++;
    if(B.stuck >= 2){
      const sisa = T.concepts.find(c => !B.met[c.id]);
      if(sisa){
        bubble("sys",terj("<b>Petunjuk:</b> {isi}", {isi:terj(B.lastHint === sisa.id && sisa.hint2 ? sisa.hint2 : sisa.hint)}));
        B.lastHint = sisa.id;
      }
      B.stuck = 0;
    }
  }

  if(n >= T.concepts.length && !B.selesai){
    B.selesai = true;
    if(T.menyerah) bubble("budi", terj(T.menyerah));
    bubble("sys",terj("Budi berubah pikiran. Yang membuatnya berubah bukan jawaban benarmu, melainkan <b>alasanmu</b>. " +
      "Debat topik ini selesai — pilih topik lain di atas, atau tekan <b>Ulangi debat</b>."));
    document.getElementById("budiIn").disabled = true;
    document.getElementById("budiSend").disabled = true;
    // Di bahasa lain argumen tidak dinilai, jadi Peta Miskonsepsi tidak disentuh (tanpa kode M).
    if(!budiDiam()) mark(T.code, "clear");
    complete(T.itemId);
  }
  B.busy = false;
}

const POS_ITEMS = { p1:["q11","q12","q13","q15","q14"], p2:["scale","q22","q23"], p3:["budi_eq","budi_konkat"] };
const POS_URUT = ["p1","p2","p3","p4"];
function posDone(p){ return p === "p4" ? 0 : POS_ITEMS[p].filter(k => S.done[k]).length; }
/* Pos berikutnya terbuka begitu pos sebelumnya tersentuh — bukan setelah
   tuntas. Kunci yang terlalu ketat berubah jadi hukuman, bukan petualangan.
   Guru tetap bisa membuka semuanya sekaligus untuk demo. */
function posOpen(p){
  if(G.openAll || p === "p1") return true;
  const i = POS_URUT.indexOf(p);
  return posDone(POS_URUT[i - 1]) >= 1 || (i >= 2 && posDone(POS_URUT[i - 2]) >= 1);
}
function renderProgress(){
  simpan();
  const n = KEY_ITEMS.filter(k => S.done[k]).length;
  document.getElementById("progbar").style.width = (100 * n / KEY_ITEMS.length) + "%";
  const rf = document.getElementById("railfill");
  if(rf) rf.style.width = (75 * n / KEY_ITEMS.length) + "%";
  const aktif = document.querySelector("section.pos.active");
  const sekarang = aktif ? aktif.id : "p1";
  POS_URUT.forEach(p => {
    const sub = document.querySelector('[data-st="' + p + '"]');
    const node = document.querySelector('[data-go="' + p + '"]');
    const dot = document.querySelector('[data-dot="' + p + '"]');
    if(!sub || !node) return;
    const tot = p === "p4" ? 0 : POS_ITEMS[p].length, d = posDone(p);
    const tuntas = tot > 0 && d === tot;
    sub.textContent = p === "p4" ? terj("peta & bekal") :
      (d === 0 ? terj("belum dikerjakan") : terj("{d} / {t} selesai", {d:d, t:tot}));
    const open = posOpen(p);
    node.dataset.state = tuntas ? "done" : (p === sekarang ? "now" : (open ? "open" : "lock"));
    node.disabled = !open;
    if(dot) dot.textContent = tuntas ? "✓" : String(POS_URUT.indexOf(p) + 1);
  });
}

function esc(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function tanggalPanjang(d){

      return new Intl.DateTimeFormat(kode, {day:"numeric", month:"long", year:"numeric"}).format(d);
    }catch(e){}
  }
  return d.getDate() + " " +
    ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][d.getMonth()] +
    " " + d.getFullYear();
}

/* ---------- 10. KODE JEJAK -------------------------------------------
   Kode 7 karakter yang menyandikan POLA pengerjaan, bukan identitas:
   6 status miskonsepsi (2 bit) + item selesai (10 bit) + jumlah percobaan
   (6 bit) + checksum (5 bit). Dikirim lewat WhatsApp; guru menempelkan
   percakapannya dan panel menyaring sendiri kode yang sah.
   Tidak ada server, tidak ada akun, tidak ada nama siswa di dalamnya. */

/* Alfabet Crockford: tanpa I, L, O, U — agar salah baca dan salah ketik
   di HP tidak menghasilkan kode lain yang kebetulan sah. */
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const ST2N = { flag:1, work:2, clear:3 };

/* Sumber kode disandikan pada salah satu dari dua bit sisa (28 bit data
   dibulatkan ke 30). Versi lama memakai bit ke-10 dari itemMask sebagai
   penanda — padahal bit itu SUDAH dipakai Modul 1 untuk item budi_konkat,
   jadi setiap siswa yang menyelesaikan debat Budi terbaca sebagai kode
   latihan. Awalan huruf dan bit sumber sekarang harus cocok; kalau tidak,
   kodenya ditolak. */
const SUMBER = { 0:{ awalan:"JJK", nama:"konsep" }, 1:{ awalan:"JLT", nama:"latihan" } };
function packCode(stat, itemMask, att, sumber){
  sumber = sumber ? 1 : 0;
  let v = 0;
  for(let i = 0; i < 6; i++) v = v * 4 + (stat[i] || 0);                 // 12 bit
  let data = ((v * 1024) + (itemMask & 1023)) * 64 + Math.min(63, att);  // 28 bit
  data = data * 4 + sumber;                                              // + 1 bit sumber, 1 bit sisa
  const ch = [];
  for(let i = 5; i >= 0; i--) ch.push(B32[Math.floor(data / Math.pow(32, i)) % 32]);
  let cs = 0;
  ch.forEach((c, i) => { cs = (cs + (i + 1) * B32.indexOf(c)) % 32; });
  ch.push(B32[cs]);
  return SUMBER[sumber].awalan + "-" + ch.slice(0, 4).join("") + "-" + ch.slice(4).join("");
}
function unpackCode(seven){
  const ch = String(seven).split("");
  if(ch.length !== 7 || ch.some(c => B32.indexOf(c) < 0)) return null;
  let cs = 0;
  for(let i = 0; i < 6; i++) cs = (cs + (i + 1) * B32.indexOf(ch[i])) % 32;
  if(B32[cs] !== ch[6]) return null;                                     // checksum gagal
  let data = 0;
  for(let i = 0; i < 6; i++) data = data * 32 + B32.indexOf(ch[i]);
  const sumber = data % 2;       data = Math.floor(data / 4);
  const att = data % 64;         data = Math.floor(data / 64);
  const itemMask = data % 1024;  data = Math.floor(data / 1024);
  const stat = [];
  for(let i = 5; i >= 0; i--){ stat[i] = data % 4; data = Math.floor(data / 4); }
  return { stat:stat, itemMask:itemMask, att:att, sumber:sumber };
}
function myCode(){
  const stat = ORDER.map(c => ST2N[S.flags[c]] || 0);
  let mask = 0;
  KEY_ITEMS.forEach((k, i) => { if(S.done[k]) mask |= (1 << i); });
  const att = LOG.length + SC.hist.length + BLOG.filter(b => b.who === "me").length;
  return packCode(stat, mask, att, 0);   // 0 = kode konsep
}
/* Menyaring kode dari teks bebas. Huruf yang mudah tertukar dinormalkan
   dulu, jadi siswa yang menulis huruf O alih-alih angka nol tetap terbaca. */
function harvest(text){
  /* Normalisasi Crockford (I,L -> 1 · O -> 0 · U -> V) hanya boleh dikenakan
     pada MUATAN kode, bukan pada awalannya. Kalau seluruh teks dinormalkan
     lebih dulu, awalan "JLT" berubah jadi "J1T" dan tidak pernah cocok. */
  const rapi = t => String(t).replace(/[IL]/g, "1").replace(/O/g, "0").replace(/U/g, "V");
  const norm = String(text).toUpperCase();
  const re = /(JJK|JLT)[^0-9A-Z]{0,2}([0-9A-Z]{4})[^0-9A-Z]{0,2}([0-9A-Z]{3})/g;
  const seen = new Set(), ok = [];
  let m, total = 0, silang = 0;
  while((m = re.exec(norm))){
    total++;
    const muatan = rapi(m[2]) + rapi(m[3]);
    const d = unpackCode(muatan);
    if(!d) continue;
    /* Awalan huruf dan bit sumber harus sepakat. Kalau tidak, kodenya
       rusak atau disunting — lebih baik ditolak daripada masuk ke kolom
       yang salah dan menggeser angka satu kelas. */
    if(SUMBER[d.sumber].awalan !== m[1]){ silang++; continue; }
    const key = m[1] + muatan;
    if(seen.has(key)) continue;                                          // kiriman ganda
    seen.add(key); ok.push(d);
  }
  return { rows:ok, total:total, ditolak:total - ok.length, silang:silang,
           konsep:ok.filter(r => r.sumber === 0), latihan:ok.filter(r => r.sumber === 1) };
}

const STAT_LABEL = [tandai("belum teruji"), tandai("perlu dikerjakan"), tandai("pulih setelah keliru"), tandai("sudah kuat")];
/* Palet status sudah lolos pemeriksaan keterbacaan buta warna
   (ΔE deutan 15,3 · penglihatan normal 21,0). Warna tidak pernah berdiri
   sendiri — setiap warna selalu didampingi label teks. */
const STAT_COLOR = ["#7a848a", "#a5301a", "#d29a05", "#14776f"];
const REMEDY = {
  M1:tandai("Pos 1 — kegiatan 1.1 dan 1.4"),
  M2:tandai("Pos 1 — kegiatan 1.2, lalu 1.5"),
  M3:tandai("Pos 2 — Neraca Kesetaraan, dan Pos 3 topik “Arti tanda =”"),
  M4:tandai("Pos 2 — Neraca Kesetaraan dan kegiatan 2.2"),

  M6:tandai("Pos 1 — kegiatan 1.3, tombol “Buka satu kotak”")

const KELAS = { hasil:null, jenis:"konsep" };
const JENIS_INFO = {
  konsep:{ label:tandai("Kode konsep (Modul 1)"),
           ket:tandai("Diukur dari empat pos konseptual: apakah salah pahamnya sudah teratasi.") },
  latihan:{ label:tandai("Kode latihan (Modul 3)"),
            ket:tandai("Diukur dari jalur level: apakah soalnya sudah lancar dikerjakan.") }
};
function renderKelas(rows, jenis){
  const res = { rows:rows };
  const n = res.rows.length;
  const tally = ORDER.map(() => [0, 0, 0, 0]);
  let selesai = 0;
  res.rows.forEach(r => {
    r.stat.forEach((v, i) => tally[i][v]++);
    let c = 0;
    for(let i = 0; i < KEY_ITEMS.length; i++) if(r.itemMask & (1 << i)) c++;
    selesai += c / KEY_ITEMS.length;
  });
  const rank = ORDER.map((c, i) => ({ code:c, i:i, buruk:tally[i][1], belum:tally[i][0] }))
    .sort((a, b) => b.buruk - a.buruk || b.belum - a.belum);
  const max = Math.max(1, rank[0].buruk);

  let h = '<div class="kstat">' +
    "<div><b>" + n + "</b>" + terj("siswa terbaca") + "</div>" +
    "<div><b>" + Math.round(100 * selesai / Math.max(1, n)) + "%</b>" + terj("rata-rata kegiatan selesai") + "</div>" +
    "<div><b>" + rank[0].code + "</b>" + terj("paling mendesak") + "</div></div>";

  h += '<div class="kfig"><h4>' + terj("Berapa siswa yang masih memegang tiap salah paham") + "</h4>" +
    '<p class="cap">' + terj("Satu batang = jumlah siswa berstatus <b>perlu dikerjakan</b> pada kode itu, " +
    "urut dari yang paling mendesak. Rincian keempat status ada pada tabel di bawah.") + "</p>";
  rank.forEach(r => {
    h += '<div class="kbar-row"><div class="kbar-lab">' + r.code + " · " + esc(terj(TAXO[r.code].name)) + "</div>" +
      '<div class="kbar-track"><div class="kbar-fill" style="width:' +
      (r.buruk ? Math.max(2, Math.round(100 * r.buruk / max)) : 0) + '%"></div></div>' +
      '<div class="kbar-val">' + r.buruk + "</div></div>";
  });
  h += "</div>";

  h += '<table class="ktab"><tr><th>' + terj("Kode") + "</th>";
  STAT_LABEL.forEach(l => { h += "<th>" + terj(l) + "</th>"; });
  h += "</tr>";
  rank.forEach(r => {
    h += "<tr><td>" + r.code + "</td>";
    for(let v = 0; v < 4; v++) h += "<td>" + tally[r.i][v] + "</td>";
    h += "</tr>";
  });
  h += "</table>";
  h += '<div class="klegend">';
  STAT_LABEL.forEach((l, v) => {
    h += '<span><i class="kdot" style="background:' + STAT_COLOR[v] + '"></i>' + terj(l) + "</span>";
  });
  h += "</div>";

  const top = rank[0];
  if(top.buruk === 0){
    h += '<div class="kadvice" style="background:var(--teal-bg);border-color:var(--teal)">' +
      terj("<b>Tidak ada salah paham yang tersisa di kelas ini.</b> Lanjutkan ke materi berikutnya, " +
      "atau bawa siswa ke Modul 2 di depan papan mading.") + "</div>";
  }else{
    h += '<div class="kadvice">' + terj("<b>Besok ulangi ini dulu: {kode} — {nama}.</b> {buruk} dari {n} siswa masih memegangnya",
      {kode:top.code, nama:esc(terj(TAXO[top.code].name)), buruk:top.buruk, n:n}) +
      (top.belum ? terj(", dan {b} siswa lagi belum sempat mengujinya", {b:top.belum}) : "") + ". " +
      terj("Bagian yang perlu diulang: <b>{bagian}</b>.", {bagian:terj(REMEDY[top.code])});
    const aman = rank.filter(r => r.buruk === 0 && r.belum <= n * 0.2).map(r => r.code);
    if(aman.length) h += " " + terj("Kode {daftar} sudah aman — tidak perlu diulang.", {daftar:aman.join(", ")});
    h += "</div>";
  }
  document.getElementById("kelasOut").innerHTML = h;
}
function gantiJenis(j){
  if(!KELAS.hasil) return;
  KELAS.jenis = j;
  const rows = j === "konsep" ? KELAS.hasil.konsep : KELAS.hasil.latihan;
  document.querySelectorAll("[data-jenis]").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.jenis === j);
  });
  const info = document.getElementById("jenisKet");
  if(info) info.textContent = terj(JENIS_INFO[j].ket);
  if(!rows.length){
    document.getElementById("kelasOut").innerHTML =
      '<div class="note">' + terj("<b>Belum ada {jenis} yang masuk.</b> Kolom ini terisi setelah siswa mengirim kode dari modul itu.",
      {jenis:terj(JENIS_INFO[j].label).toLowerCase()}) + "</div>";
    return;
  }
  renderKelas(rows, j);
}

function selectBox(box){
  const r = document.createRange(); r.selectNodeContents(box);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  say("kode","hint",terj("Peramban ini tidak mengizinkan salin otomatis. Kodenya sudah disorot — " +
    "tekan lama lalu pilih <b>Copy</b>."));
}
document.getElementById("btnSalin").addEventListener("click", () => {
  const box = document.getElementById("kodeBox");
  if(box.style.display === "none" || box.textContent === "—"){
    say("kode","hint",terj("Tekan <b>Buat kode</b> dulu.")); return;
  }
  const t = box.textContent;
  const done = () => say("kode","ok",terj("Kode <b>{k}</b> tersalin. Tempel di grup WhatsApp kelas.", {k:t}));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, () => selectBox(box));
  }else selectBox(box);
});

document.getElementById("btnBaca").addEventListener("click", () => {
  const txt = document.getElementById("paste").value;
  if(!txt.trim()){ say("kelas","hint",terj("Tempel dulu percakapan WhatsApp-nya.")); return; }
  const res = harvest(txt);
  if(!res.rows.length){
    document.getElementById("kelasOut").innerHTML = "";
    say("kelas","bad",terj("Tidak ada kode sah yang ditemukan") +
      (res.total ? " " + terj("— padahal ada {n} teks yang berbentuk kode. Checksum-nya tidak cocok, " +
       "jadi kode itu sengaja ditolak daripada memberimu angka yang keliru.", {n:res.total}) : ".")); return;
  }
  KELAS.hasil = res;
  document.getElementById("jenisRow").classList.remove("hide");
  document.querySelectorAll("[data-jenis]").forEach(b => {
    const j = b.dataset.jenis;
    const c = (j === "konsep" ? res.konsep : res.latihan).length;
    b.textContent = terj(JENIS_INFO[j].label) + " · " + c;
    b.disabled = c === 0;
  });
  /* Kalau satu siswa mengirim dua kode, keduanya sah — tapi mereka mengukur
     hal yang berbeda dan TIDAK boleh dijumlahkan jadi satu angka kelas. */
  gantiJenis(res.konsep.length >= res.latihan.length ? "konsep" : "latihan");
  /* Argumen keempat say() adalah KODE diagnostik (M1–M6), bukan teks bebas.
     Catatan panjang ditempelkan sendiri sebagai <span class="diag">. */
  const catatan = (res.konsep.length && res.latihan.length)
    ? '<span class="diag">' + terj("Keduanya <b>tidak dijumlahkan</b> — kode konsep mengukur apakah salah pahamnya " +
      "sudah teratasi, kode latihan mengukur apakah soalnya sudah lancar. Seorang siswa bisa lancar " +
      "mengerjakan soal tapi tetap memegang salah paham; itu justru temuan yang berguna.") + "</span>"
    : "";
  say("kelas","ok", terj("{a} kode konsep dan {b} kode latihan terbaca", {a:res.konsep.length, b:res.latihan.length}) +
    (res.ditolak ? terj(", {n} diabaikan karena ganda atau salah ketik", {n:res.ditolak}) : "") +
    (res.silang ? terj(", {n} ditolak karena awalan dan isinya tidak cocok", {n:res.silang}) : "") + "." + catatan);
});

/* ---- sisi guru: kartu lapangan Modul 2 ----
   Kartu datang sebagai foto dari grup WhatsApp. Datanya dibaca dari pita
   di bawah kartu (kartuBacaGambar), fotonya ditampilkan apa adanya.
   Semuanya hanya di memori: foto siswa tidak pernah ditulis ke
   localStorage, dan hilang begitu halaman ditutup. */
const LAPANGAN = { kartu:[] };
/* Bukan say(): say() mencatat setiap pesan ke LOG — riwayat jawaban SISWA
   yang disimpan ke localStorage — padahal ini pesan untuk guru, berisi nama
   berkas foto dari WhatsApp. Panel ini tidak boleh menulis apa pun ke
   penyimpanan, dan tidak boleh menyentuh Peta Miskonsepsi. */
function lapanganKata(kind, html){
  const el = document.getElementById("fb-lapangan");
  el.className = "fb show " + kind; el.innerHTML = html;
}
const ALASAN_KARTU = {
  "rasio":       tandai("bukan kartu lapangan, atau gambarnya sudah dipotong"),
  "kontras":     tandai("pita datanya tidak terlihat — bukan kartu lapangan, atau terpotong di bagian bawah"),
  "sandi":       tandai("pita datanya rusak — terlalu buram atau tertutup coretan"),
  "versi":       tandai("dibuat oleh versi media yang lebih baru dari Panel Guru ini — muat ulang halaman Panel Guru"),
  "kosong":      tandai("gambarnya kosong"),
  "bukan-gambar":tandai("berkasnya tidak bisa dibuka sebagai gambar")
};
/* Jejak sebuah pindaian hanya bisa bertambah, jadi kartu yang lebih
   "berat" pasti dibuat lebih belakangan dari pindaian yang sama. */
function bobotKartu(d){
  return KARTU_LANGKAH.filter(k => d.selesai[k]).length * 100 + d.ukurUlang + d.kDua + d.kLuas + d.kLain +
    (d.soal ? 1 : 0) + (d.soalOk ? 1 : 0);
}
function bacaBerkasKartu(berkas){
  return new Promise(selesai => {
    const url = URL.createObjectURL(berkas), im = new Image();
    const nama = berkas.name || terj("gambar tempelan");
    im.onload = () => selesai({ url:url, nama:nama, hasil:kartuBacaGambar(im) });
    im.onerror = () => selesai({ url:url, nama:nama, hasil:{ alasan:"bukan-gambar" } });
    im.src = url;
  });
}
async function terimaKartu(daftar){
  const gambar = Array.from(daftar || []).filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|webp)$/i.test(f.name));
  if(!gambar.length){ lapanganKata("hint",terj("Tidak ada berkas gambar di situ. Kartu lapangan berupa foto PNG atau JPG.")); return; }
  const hasil = await Promise.all(gambar.map(bacaBerkasKartu));
  let baru = 0, ganda = 0;
  const gagal = [];
  hasil.forEach(h => {
    const d = h.hasil.d;
    if(!d){ gagal.push(h); URL.revokeObjectURL(h.url); return; }
    const i = LAPANGAN.kartu.findIndex(k => k.d.id === d.id);
    if(i < 0){ LAPANGAN.kartu.push({ d:d, url:h.url }); baru++; return; }
    // Pindaian yang sama dikirim ulang: simpan versi yang paling lengkap.
    ganda++;
    if(bobotKartu(d) >= bobotKartu(LAPANGAN.kartu[i].d)){
      URL.revokeObjectURL(LAPANGAN.kartu[i].url); LAPANGAN.kartu[i] = { d:d, url:h.url };
    }else URL.revokeObjectURL(h.url);
  });
  renderLapangan();
  const rincianGagal = gagal.length
    ? '<span class="diag"><b>' + terj("Tidak terbaca:") + "</b> " + gagal.map(h => esc(h.nama) + " — " +
        terj(ALASAN_KARTU[h.hasil.alasan] || "tidak dikenali")).join("; ") +
      ". " + terj("Kartu ditolak daripada memberimu angka yang keliru; minta siswanya mengirim ulang kartu utuh.") + "</span>"
    : "";
  if(!baru && !ganda){
    lapanganKata("bad",terj("Tidak ada kartu lapangan yang terbaca dari {n} gambar.", {n:gambar.length}) + rincianGagal);
    return;
  }
  lapanganKata("ok", terj("{n} kartu baru terbaca", {n:baru}) +
    (ganda ? terj(", {n} kiriman ulang dari pindaian yang sama (disimpan yang paling lengkap)", {n:ganda}) : "") +
    ". " + terj("Total {n} kartu.", {n:LAPANGAN.kartu.length}) + rincianGagal);
}
function tanggalKartu(hari){
  const t = new Date(2026, 0, 1 + hari);
  if(JEJAK_BHS.kini() !== "id"){
    try{ return t.toLocaleDateString(JEJAK_BHS.BAHASA.filter(b => b.id === JEJAK_BHS.kini())[0].lang, { day:"numeric", month:"short" }); }
    catch(e){}
  }
  return t.getDate() + " " + ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"][t.getMonth()];
}
const JENIS_SOAL = { maju:tandai("soal maju"), mundur:tandai("soal mundur"), perubahan:tandai("soal perubahan") };
function angkaKartu(v, n){ return String(+(+v).toFixed(n)); }
/* Urutan galeri = urutan perhatian guru: yang paling butuh dilihat duluan. */
function urgensiKartu(d){
  if(d.statusUkur === 2) return 0;
  if(d.kDua || d.kLuas || d.kLain) return d.selesai.cSub ? 2 : 1;
  if(d.statusUkur === 0) return 3;
  if(!d.selesai.cSub) return 4;
  if(d.soal && !d.soalOk) return 4;
  return 5;
}
function renderLapangan(){
  const out = document.getElementById("lapanganOut");
  const K = LAPANGAN.kartu.map(k => k.d), n = K.length;
  if(!n){ out.innerHTML = ""; return; }
  const cocok = K.filter(d => d.statusUkur === 1).length;
  const belumCocok = K.filter(d => d.statusUkur === 2).length;
  const kBenar = K.filter(d => d.selesai.cSub).length;
  const m2 = K.filter(d => d.kDua > 0).length;
  const luas = K.filter(d => d.kLuas > 0).length;
  const miring = K.filter(d => d.miring > 0.25).length;
  const berwaktu = K.filter(d => d.waktu !== null);
  const lewat = berwaktu.filter(d => d.waktu >= KARTU.BATAS_MENIT).length;
  // Kartu versi lama dibuat sebelum Langkah 5 ada: tidak dihitung sebagai "tidak membuat soal".
  const bisaSoal = K.filter(d => d.versi >= 3);
  const bersoal = bisaSoal.filter(d => d.soal);
  const soalSalah = bersoal.filter(d => !d.soalOk).length;
  const soalMaju = bersoal.filter(d => d.soal === "maju").length;
  const M = KARTU.BATAS_MENIT;

  let h = '<div class="kstat">' +
    "<div><b>" + n + "</b>" + terj("kartu terbaca") + "</div>" +
    "<div><b>" + cocok + "/" + n + "</b>" + terj("ukuran cocok dengan kamera") + "</div>" +
    "<div><b>" + kBenar + "/" + n + "</b>" + terj("keliling benar") + "</div>" +
    (berwaktu.length ? "<div><b>" + (berwaktu.length - lewat) + "/" + berwaktu.length + "</b>" +
      terj("kartu dibuat dalam {m} menit", {m:M}) + "</div>" : "") +
    (bisaSoal.length ? "<div><b>" + bersoal.length + "/" + bisaSoal.length + "</b>" + terj("membuat soal sendiri") + "</div>" : "") +
    "</div>";

  const saran = [];
  if(belumCocok) saran.push(terj("<b>{n} siswa ukurannya belum cocok</b> dengan perbandingan yang dilihat " +
    "kamera. Lihat fotonya: sudut yang meleset, <i>p</i> dan <i>l</i> tertukar, atau pengukuran yang perlu diulang.", {n:belumCocok}));
  if(m2) saran.push(terj("<b>{n} siswa sempat menjumlahkan dua sisi saja</b> (M2 — sebagian struktur bangun " +
    "terlewat). Telusuri ulang keempat tepi papan bersama mereka.", {n:m2}));
  if(luas) saran.push(terj("<b>{n} siswa sempat menghitung luas</b>, bukan keliling.", {n:luas}));
  if(miring) saran.push(terj("<b>{n} foto terlalu menyerong</b> — perbandingan kameranya kurang bisa dipercaya, " +
    "jadi ketidakcocokan di kartu itu belum tentu salah siswa.", {n:miring}));
  if(lewat) saran.push(terj("<b>{n} kartu dibuat setelah {m} menit.</b> Lihat langkah " +
    "yang belum selesai di kartunya — waktunya mungkin kurang, atau ada yang tertahan di satu langkah.", {n:lewat, m:M}));
  if(soalSalah) saran.push(terj("<b>{n} soal buatan siswa kuncinya belum cocok</b> dengan soalnya. " +
    "Bahas di kelas: periksa kunci dengan memasukkannya kembali ke rumus.", {n:soalSalah}));
  if(bersoal.length >= 3 && soalMaju * 2 > bersoal.length) saran.push(terj("<b>Sebagian besar soal masih soal maju</b> " +
    "({a} dari {b}) — substitusi biasa. Minta mereka membalik soalnya menjadi soal mundur.", {a:soalMaju, b:bersoal.length}));
  h += saran.length
    ? '<div class="kadvice">' + saran.join("<br>") + "</div>"
    : '<div class="kadvice" style="background:var(--teal-bg);border-color:var(--teal)">' + terj("<b>Semua kartu bersih.</b> " +
      "Ukuran siswa cocok dengan struktur yang dilihat kamera, dan kelilingnya benar.") + "</div>";

  h += '<div class="kgal">';
  LAPANGAN.kartu.slice().sort((a, b) => urgensiKartu(a.d) - urgensiKartu(b.d)).forEach(k => {
    const d = k.d;
    const ukur = d.statusUkur === 0 ? "— " + terj("belum mengukur")
      : (d.statusUkur === 1 ? "✓ " + terj("ukuran cocok") : "✗ " + terj("ukuran belum cocok"));
    const kel = d.selesai.cSub ? "✓ " + terj("keliling benar")
      : ((d.kDua || d.kLuas || d.kLain) ? "✗ " + terj("keliling belum benar") : "— " + terj("keliling belum dikerjakan"));
    const rUkur = d.statusUkur ? Math.max(d.p, d.l) / Math.min(d.p, d.l) : 0;
    const salah = [];
    if(d.kDua) salah.push(terj("{n}× dua sisi (M2)", {n:d.kDua}));
    if(d.kLuas) salah.push(terj("{n}× luas", {n:d.kLuas}));
    if(d.kLain) salah.push(terj("{n}× lain", {n:d.kLain}));
    h += '<figure class="kkartu' + (urgensiKartu(d) < 2 ? " perlu" : "") + '">' +
      '<a class="kfoto" href="' + k.url + '" target="_blank" rel="noopener" title="' + terj("Buka kartu utuh") + '">' +
      '<img src="' + k.url + '" alt="' + terj("Foto papan dan garis bangun dari kartu lapangan") + '"></a>' +
      "<figcaption><b>" + ukur + "</b><br>" +
      terj("kamera") + " " + angkaKartu(d.rasio, 2) + " × · " + terj("siswa") + " " +
      (d.statusUkur ? angkaKartu(rUkur, 2) + " ×" : "—") +
      (d.ukurUlang ? " · " + terj("ulang {n}×", {n:d.ukurUlang}) : "") + "<br>" +
      kel + (salah.length ? " (" + salah.join(", ") + ")" : "") + "<br>" +
      (d.versi >= 3 ? (d.soal ? "✎ " + terj(JENIS_SOAL[d.soal] || d.soal) + " · " +
        (d.soalOk ? "✓ " + terj("kunci cocok") : "✗ " + terj("kunci belum cocok")) +
        ' <span class="kket">' + terj("(kalimatnya di kartu utuh)") + "</span>" : "— " + terj("belum membuat soal")) + "<br>" : "") +
      '<span class="kket">' + tanggalKartu(d.hari) +
      (d.waktu !== null ? " · " + terj("{m} menit", {m:d.waktu >= 30 ? "30+" : d.waktu}) +
        (d.waktu >= M ? " " + terj("(lewat batas)") : "") : "") +
      (d.miring > 0.25 ? " · " + terj("foto menyerong") : "") +
      (d.digeser ? " · " + terj("sudut dibetulkan sendiri") : "") + "</span></figcaption></figure>";
  });
  h += "</div>";
  out.innerHTML = h;
}

     "=" memang yang paling membandel di literatur. Acaknya bersifat tetap
     agar demo di depan juri dapat diulang dengan hasil yang sama. */
  const nama = ["Aisyah","Bagas","Citra","Dimas","Elok","Fajar","Gita","Hafiz","Intan","Joko",
                "Kirana","Lutfi","Maya","Nanda","Okta","Putri","Qori","Rizky","Sinta","Tegar",
                "Umi","Vina","Wahyu","Yoga","Zahra","Andi","Bella","Candra","Dewi","Eka","Farid"];
  const berat = [0.16, 0.19, 0.61, 0.42, 0.26, 0.10];
  let out = "";
  nama.forEach((n, i) => {

      const r = ((i * 37 + k * 11 + 7) % 100) / 100;

      if(r < pr + 0.86) return 3;
      return 0;
    });
    out += "[07:" + (10 + (i % 50)) + "] " + n + ": " + packCode(stat, ((i * 53) % 1024) | 31, 8 + (i % 20), 0) + "\n";

       bahwa panel memisahkannya, bukan menjumlahkannya. */
    if(i % 3 === 0){
      const sl = stat.map((v, k) => (v === 1 && k !== 2) ? 3 : v);
      out += "[07:" + (11 + (i % 48)) + "] " + n + ": " + packCode(sl, 63, 20 + (i % 30), 1) + "\n";
    }
  });

/* Pemulihan dijalankan sebelum render pertama, supaya siswa tidak sempat
   melihat papan kosong lalu tiba-tiba terisi. */
function pulihkan(){
  const d = muatState();
  if(!d) return;
  S.letter = d.letter || S.letter;
  S.nBox = d.nBox != null ? d.nBox : S.nBox;
  S.nLoose = d.nLoose != null ? d.nLoose : S.nLoose;
  S.subVal = d.subVal != null ? d.subVal : S.subVal;
  S.flags = d.flags || {}; S.done = d.done || {}; S.q11ok = !!d.q11ok;
  G.xp = d.xp || 0; G.badges = d.badges || {}; G.seenBangkit = d.seenBangkit || {};
  G.openAll = !!d.openAll;
  (d.log || []).forEach(r => LOG.push(r));
  (d.blog || []).forEach(r => BLOG.push(r));
  (d.schist || []).forEach(r => SC.hist.push(r));
  SC.trapped = !!d.sctrapped;
  const n = document.getElementById("idNama"), k = document.getElementById("idKelas");
  if(n && d.nama) n.value = d.nama;
  if(k && d.kelas) k.value = d.kelas;
  if(S.q11ok){
    const el = document.getElementById("q11");
    if(el) el.value = S.letter;
  }
  const bar = document.getElementById("restoreBar");
  if(bar){
    // Angkanya dibekukan saat dipulihkan: berganti bahasa tidak boleh mengubah isi pesannya.
    PULIH = { sel:KEY_ITEMS.filter(x => S.done[x]).length, xp:G.xp };
    tulisPulih();
    bar.classList.remove("hide");
  }
  if(G.openAll) tulisBukaSemua();
}
function tulisPulih(){
  const el = document.getElementById("restoreTxt");
  if(!PULIH || !el) return;
  el.innerHTML = terj("<b>Kemajuanmu dipulihkan.</b> {a} dari {b} kegiatan sudah selesai, {x} jejak terkumpul. " +
    "Kemajuan tersimpan di peramban ini saja — bukan di server mana pun.", {a:PULIH.sel, b:KEY_ITEMS.length, x:PULIH.xp});
}

}

/* Menu utama menautkan langsung ke #panelGuru, padahal Panel Guru ada di
   Pos 4 yang tersembunyi sampai dibuka — tautan itu dulu mendarat di Pos 1
   dan guru tidak menemukan panelnya. Guru bukan siswa: tampilkan Pos 4
   tanpa membuka kunci pos lain dan tanpa mengubah kemajuan siapa pun. */
function bukaPanelDariHash(){
  const id = location.hash.slice(1);
  if(id !== "panelGuru" && id !== "panelLapangan") return;
  const sasaran = document.getElementById(id), pos = sasaran.closest("section.pos");
  document.querySelectorAll("section.pos").forEach(s => s.classList.toggle("active", s === pos));
  document.querySelectorAll("nav.pos button").forEach(b => b.setAttribute("aria-current", String(b.dataset.go === pos.id)));
  const hdr = document.querySelector("header.top").offsetHeight;
  window.scrollTo({ top:Math.max(0, sasaran.getBoundingClientRect().top + scrollY - hdr - 10) });
}
bukaPanelDariHash();

<script>
/* =====================================================================
   TEMA — cuplikan bersama, disalin apa adanya ke setiap berkas.

   Pilihan tema disimpan pada satu kunci yang sama untuk kelima berkas,
   sehingga mengganti tema di satu modul langsung berlaku di modul lain.
   Kunci ini TERPISAH dari kunci kemajuan; menghapus kemajuan tidak
   menghapus pilihan tema, dan sebaliknya.
   ===================================================================== */
(function(){
  "use strict";
  var KUNCI = "jejak.tema.v1";
  var TEMA = [
    { id:"kertas",  nm:"Kertas",         ket:"Hangat, silau rendah — bawaan", a:"#faf7f2", b:"#14776f" },
    { id:"laut",    nm:"Laut",           ket:"Sejuk, untuk ruang berlampu kuning", a:"#f1f6f8", b:"#0f6f74" },
    { id:"malam",   nm:"Malam",          ket:"Gelap, untuk belajar malam", a:"#131a1c", b:"#40bfb2" },
    { id:"kontras", nm:"Kontras Tinggi", ket:"Garis tegas, untuk proyektor & penglihatan rendah", a:"#ffffff", b:"#000000" }
  ];
  var sah = {}; TEMA.forEach(function(t){ sah[t.id] = t; });
  /* Terjemahan hanya ada di halaman yang memuat cuplikan BAHASA
     (bahasa-js.txt). Di halaman lain teksnya tetap bahasa Indonesia. */
  function tr(s){ return window.terj ? window.terj(s) : s; }

  /* localStorage bisa ditolak sepenuhnya (mode penyamaran, kebijakan
     perangkat sekolah, iframe tanpa izin). Kalau itu terjadi, tema tetap
     bisa diganti untuk sesi ini — hanya tidak diingat. */
  function baca(){
    try{ var v = localStorage.getItem(KUNCI); return sah[v] ? v : "kertas"; }
    catch(e){ return "kertas"; }
  }
  function simpan(v){ try{ localStorage.setItem(KUNCI, v); }catch(e){} }

  function pakai(v){
    if(!sah[v]) v = "kertas";
    document.documentElement.setAttribute("data-tema", v);
    var b = document.getElementById("btnTema");
    if(b) b.lastChild.nodeValue = " " + tr(sah[v].nm);
    var m = document.getElementById("temaMenu");
    if(m) Array.prototype.forEach.call(m.querySelectorAll("button[data-tema]"), function(t){
      var aktif = t.getAttribute("data-tema") === v;
      t.setAttribute("aria-checked", aktif ? "true" : "false");
      var tk = t.querySelector(".tick");
      if(tk) tk.textContent = aktif ? tr("dipakai") : "";
    });
  }

  function bangun(){
    var w = document.getElementById("temaWrap");
    if(!w) return;
    var html = '<button class="temaBtn" id="btnTema" aria-haspopup="true" aria-expanded="false" ' +
               'aria-controls="temaMenu" title="' + tr("Ganti tema warna") + '">' +
               '<span aria-hidden="true">◐</span> ' + tr("Tema") + '</button>' +
               '<div class="temaMenu" id="temaMenu" role="menu" hidden aria-label="' + tr("Tema warna") + '">' +
               '<div class="hd">' + tr("Tema warna") + '</div>';
    TEMA.forEach(function(t){
      html += '<button type="button" role="menuitemradio" aria-checked="false" data-tema="' + t.id + '">' +
              '<span class="sw" aria-hidden="true"><i style="background:' + t.a + '"></i>' +
              '<i style="background:' + t.b + '"></i><i style="background:' + t.b +
              '"></i><i style="background:' + t.a + '"></i></span>' +
              '<span><span class="nm">' + tr(t.nm) + '</span>' +
              '<span class="ket">' + tr(t.ket) + '</span></span>' +
              '<span class="tick"></span></button>';
    });
    html += "</div>";
    w.innerHTML = html;

    var btn = document.getElementById("btnTema");
    var menu = document.getElementById("temaMenu");
    function tutup(){ menu.hidden = true; btn.setAttribute("aria-expanded", "false"); }
    function buka(){ menu.hidden = false; btn.setAttribute("aria-expanded", "true"); }

    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(menu.hidden){ buka(); } else { tutup(); }
    });
    menu.addEventListener("click", function(e){
      var t = e.target.closest ? e.target.closest("button[data-tema]") : null;
      if(!t) return;
      var v = t.getAttribute("data-tema");
      pakai(v); simpan(v); tutup(); btn.focus();
    });
    /* Menu ditutup lewat klik di luar dan tombol Escape. Sengaja tidak
       memakai dialog bawaan peramban: dialog memblokir seluruh halaman dan
       pada sebagian peramban dalam-aplikasi tidak muncul sama sekali. */
    document.addEventListener("click", function(e){
      if(!menu.hidden && !w.contains(e.target)) tutup();
    });
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape" && !menu.hidden){ tutup(); btn.focus(); }
    });

    pakai(baca());
    // Bahasa berganti → label tema ikut berganti, pilihan tema tidak berubah.
    document.addEventListener("jejak:bahasa", function(){
      btn.setAttribute("title", tr("Ganti tema warna"));
      menu.setAttribute("aria-label", tr("Tema warna"));
      menu.querySelector(".hd").textContent = tr("Tema warna");
      Array.prototype.forEach.call(menu.querySelectorAll("button[data-tema]"), function(t){
        var x = sah[t.getAttribute("data-tema")];
        t.querySelector(".nm").textContent = tr(x.nm);
        t.querySelector(".ket").textContent = tr(x.ket);
      });
      pakai(document.documentElement.getAttribute("data-tema"));
    });
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", bangun);
  else bangun();

  window.__tema = { pakai:pakai, baca:baca, TEMA:TEMA, KUNCI:KUNCI };
})();
</script>
