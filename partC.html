<script>
/* =====================================================================
   BAHASA — cuplikan bersama, disalin apa adanya ke setiap berkas yang
   sudah diterjemahkan (sekarang: index.html, ar-ukur.html, dan Modul 1
   lewat partC.html). Harus
   dimuat SEBELUM skrip halaman, karena skrip halaman memanggil terj()
   sejak awal.

   Teks sumber tetap bahasa Indonesia DI DALAM KODE. Kamus memetakan
   kalimat Indonesia → terjemahan, jadi kode tetap terbaca oleh penulisnya.
   Kalimat yang belum ada di kamus tampil dalam bahasa Indonesia — layar
   tidak pernah kosong — dan dicatat di JEJAK_BHS.hilang untuk pengujian.

     terj("Kalimat dengan {x}.", {x:3})  terjemahkan sekarang, isi {x}
     tandai("Kalimat")                   kembalikan apa adanya; hanya
                                          menandai kalimat yang diterjemahkan
                                          belakangan (mis. nama lencana)
     <p data-t>…</p>                      isi elemen diterjemahkan utuh;
                                          JANGAN berisi elemen ber-id
     data-t-attr="placeholder alt"        atribut yang ikut diterjemahkan
     {n|box|boxes}                        (hanya di terjemahan) bentuk tunggal
                                          bila nilai n = 1, jamak bila bukan —
                                          bahasa Inggris butuh "1 box"/"2 boxes";
                                          bahasa Indonesia, Mandarin, Korea tidak

   Saat bahasa berganti: markup diterjemahkan ulang, <html lang> diganti,
   lalu peristiwa "jejak:bahasa" dikirim ke document agar halaman
   menggambar ulang teks dinamisnya. Pilihan bahasa disimpan pada satu
   kunci untuk semua berkas, terpisah dari kunci kemajuan.
   ===================================================================== */
(function(){
  "use strict";
  var KUNCI = "jejak.bahasa.v1";
  var BAHASA = [
    { id:"id", nm:"Bahasa Indonesia", pendek:"ID",     lang:"id",      ket:"Indonesia" },
    { id:"en", nm:"English",          pendek:"EN",     lang:"en",      ket:"Inggris" },
    { id:"zh", nm:"中文（简体）",       pendek:"中文",   lang:"zh-Hans", ket:"Mandarin (aksara sederhana)" },
    { id:"ko", nm:"한국어",            pendek:"한국어", lang:"ko",      ket:"Korea" }
  ];
  var sah = {}; BAHASA.forEach(function(b){ sah[b.id] = b; });
  var KAMUS = { en:{}, zh:{}, ko:{} };
  var hilang = {};

  /* localStorage bisa ditolak sepenuhnya. Bahasa tetap bisa diganti untuk
     sesi ini — hanya tidak diingat. */
  function baca(){
    try{ var v = localStorage.getItem(KUNCI); return sah[v] ? v : "id"; }
    catch(e){ return "id"; }
  }
  function simpan(v){ try{ localStorage.setItem(KUNCI, v); }catch(e){} }
  var kini = baca();

  function rapi(s){ return String(s).replace(/\s+/g, " ").trim(); }
  function tambah(kamus){
    for(var b in kamus) if(KAMUS[b]) for(var k in kamus[b]) KAMUS[b][rapi(k)] = kamus[b][k];
  }
  function terj(teks, nilai){
    var hasil = teks;
    if(kini !== "id"){
      var k = rapi(teks), ada = KAMUS[kini][k];
      if(ada) hasil = ada; else hilang[kini + " | " + k] = true;
    }
    if(nilai) hasil = String(hasil)
      .replace(/\{(\w+)\|([^|}]*)\|([^}]*)\}/g, function(m, n, satu, banyak){
        return Object.prototype.hasOwnProperty.call(nilai, n) ? (Number(nilai[n]) === 1 ? satu : banyak) : m;
      })
      .replace(/\{(\w+)\}/g, function(m, n){
        return Object.prototype.hasOwnProperty.call(nilai, n) ? nilai[n] : m;
      });
    return hasil;
  }
  function tandai(teks){ return teks; }

  function terapkan(){
    document.documentElement.setAttribute("lang", sah[kini].lang);
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function(el){
      if(el.__asli === undefined) el.__asli = el.innerHTML;
      el.innerHTML = terj(el.__asli);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-t-attr]"), function(el){
      if(!el.__asliAttr) el.__asliAttr = {};
      el.getAttribute("data-t-attr").split(/\s+/).forEach(function(a){
        if(!a) return;
        if(!(a in el.__asliAttr)) el.__asliAttr[a] = el.getAttribute(a);
        if(el.__asliAttr[a] !== null) el.setAttribute(a, terj(el.__asliAttr[a]));
      });
    });
    labelPemilih();
  }

  function labelPemilih(){
    var b = document.getElementById("btnBahasa");
    if(b){
      b.lastChild.nodeValue = " " + sah[kini].pendek;
      b.setAttribute("title", terj("Ganti bahasa") + " · Language");
    }
    var m = document.getElementById("bahasaMenu");
    if(m) Array.prototype.forEach.call(m.querySelectorAll("button[data-bahasa]"), function(t){
      var v = t.getAttribute("data-bahasa"), aktif = v === kini;
      t.setAttribute("aria-checked", aktif ? "true" : "false");
      t.querySelector(".ket").textContent = terj(sah[v].ket);
      // Pilihan ditandai dengan kata, tidak hanya warna.
      t.querySelector(".tick").textContent = aktif ? terj("dipakai") : "";
    });
  }

  function pilih(v){
    if(!sah[v]) v = "id";
    kini = v;
    terapkan();
    var ev;
    try{ ev = new CustomEvent("jejak:bahasa", { detail:{ bahasa:v } }); }
    catch(e){ ev = document.createEvent("CustomEvent"); ev.initCustomEvent("jejak:bahasa", false, false, { bahasa:v }); }
    document.dispatchEvent(ev);
  }

  /* Pemilih memakai kelas yang sama dengan pemilih tema, jadi tampilannya
     ikut tema tanpa CSS tambahan. Judul menunya selalu menyebut keempat
     bahasa: siswa yang tersesat di bahasa yang tidak ia baca tetap bisa
     menemukan jalan pulang. */
  function bangun(){
    var w = document.getElementById("bhsWrap");
    if(w){
      var html = '<button class="temaBtn" id="btnBahasa" aria-haspopup="true" aria-expanded="false" ' +
                 'aria-controls="bahasaMenu"><span aria-hidden="true">🌐</span> ID</button>' +
                 '<div class="temaMenu" id="bahasaMenu" role="menu" hidden aria-label="Bahasa · Language">' +
                 '<div class="hd">Bahasa · Language · 语言 · 언어</div>';
      BAHASA.forEach(function(b){
        html += '<button type="button" role="menuitemradio" aria-checked="false" data-bahasa="' + b.id +
                '" lang="' + b.lang + '"><span><span class="nm">' + b.nm + '</span>' +
                '<span class="ket"></span></span><span class="tick"></span></button>';
      });
      w.innerHTML = html + "</div>";
      var btn = document.getElementById("btnBahasa"), menu = document.getElementById("bahasaMenu");
      var tutup = function(){ menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        if(menu.hidden){ menu.hidden = false; btn.setAttribute("aria-expanded", "true"); } else tutup();
      });
      menu.addEventListener("click", function(e){
        var t = e.target.closest ? e.target.closest("button[data-bahasa]") : null;
        if(!t) return;
        var v = t.getAttribute("data-bahasa");
        simpan(v); tutup(); btn.focus();
        if(v !== kini) pilih(v);
      });
      document.addEventListener("click", function(e){ if(!menu.hidden && !w.contains(e.target)) tutup(); });
      document.addEventListener("keydown", function(e){
        if(e.key === "Escape" && !menu.hidden){ tutup(); btn.focus(); }
      });
    }
    terapkan();
  }

  tambah({
    en:{ "Ganti bahasa":"Change language", "dipakai":"in use", "Indonesia":"Indonesian", "Inggris":"English",
         "Mandarin (aksara sederhana)":"Chinese (Simplified)", "Korea":"Korean" },
    zh:{ "Ganti bahasa":"切换语言", "dipakai":"使用中", "Indonesia":"印度尼西亚语", "Inggris":"英语",
         "Mandarin (aksara sederhana)":"简体中文", "Korea":"韩语" },
    ko:{ "Ganti bahasa":"언어 바꾸기", "dipakai":"사용 중", "Indonesia":"인도네시아어", "Inggris":"영어",
         "Mandarin (aksara sederhana)":"중국어(간체)", "Korea":"한국어" }
  });
  // Teks cuplikan tema (tema-js.txt) — diterjemahkan di sini karena tema dipakai di semua halaman.
  tambah({
    en:{ "Tema":"Theme", "Ganti tema warna":"Change colour theme", "Tema warna":"Colour theme",
         "Kertas":"Paper", "Laut":"Sea", "Malam":"Night", "Kontras Tinggi":"High Contrast",
         "Hangat, silau rendah — bawaan":"Warm, low glare — default",
         "Sejuk, untuk ruang berlampu kuning":"Cool, for rooms with yellow lighting",
         "Gelap, untuk belajar malam":"Dark, for studying at night",
         "Garis tegas, untuk proyektor & penglihatan rendah":"Sharp lines, for projectors & low vision" },
    zh:{ "Tema":"主题", "Ganti tema warna":"更换配色主题", "Tema warna":"配色主题",
         "Kertas":"纸张", "Laut":"海洋", "Malam":"夜间", "Kontras Tinggi":"高对比度",
         "Hangat, silau rendah — bawaan":"暖色、低眩光——默认",
         "Sejuk, untuk ruang berlampu kuning":"冷色调，适合黄色灯光的教室",
         "Gelap, untuk belajar malam":"深色，适合夜间学习",
         "Garis tegas, untuk proyektor & penglihatan rendah":"线条清晰，适合投影仪和视力较弱者" },
    ko:{ "Tema":"테마", "Ganti tema warna":"색 테마 바꾸기", "Tema warna":"색 테마",
         "Kertas":"종이", "Laut":"바다", "Malam":"밤", "Kontras Tinggi":"고대비",
         "Hangat, silau rendah — bawaan":"따뜻하고 눈부심이 적음 — 기본",
         "Sejuk, untuk ruang berlampu kuning":"시원한 색, 노란 조명 교실용",
         "Gelap, untuk belajar malam":"어두운 색, 밤 공부용",
         "Garis tegas, untuk proyektor & penglihatan rendah":"선명한 선, 프로젝터·저시력용" }
  });

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", bangun);
  else bangun();

  window.terj = terj;
  window.tandai = tandai;
  window.JEJAK_BHS = { kini:function(){ return kini; }, terj:terj, tambah:tambah, pilih:pilih,
                       BAHASA:BAHASA, KUNCI:KUNCI, KAMUS:KAMUS, hilang:hilang, baca:baca };
})();
</script>

  "Penjelasanmu tercatat di Lembar Kerja untuk dibaca gurumu.": "Your explanation has been recorded on the Worksheet for your teacher to read.",
  "Pemeriksaan otomatis jawaban terbuka hanya tersedia dalam bahasa Indonesia, jadi penjelasan ini tidak dinilai.": "Automatic checking of open answers is only available in Indonesian, so this explanation isn't assessed.",
  "Tepat. <span class=\"math\">p + p + 80 + 80 = 2p + 160</span>. Dua sisi panjang belum diketahui sehingga tetap ditulis sebagai <span class=\"math\">2p</span>, dua sisi lebar sudah diketahui sehingga menjadi 160. Keduanya berdiri berdampingan.": "Exactly. <span class=\"math\">l + l + 80 + 80 = 2l + 160</span>. The two long sides are unknown, so they stay written as <span class=\"math\">2l</span>; the two short sides are known, so they become 160. The two parts stand side by side.",
  "Kamu menyatukan yang belum diketahui dengan yang sudah diketahui. Uji dengan p = 100: papan 100 × 80 cm punya keliling 360 cm, tapi jawabanmu memberi angka yang jauh berbeda.": "You merged the unknown with the known. Test with l = 100: a 100 × 80 cm board has a perimeter of 360 cm, but your answer gives a very different number.",
  "Sisi panjangnya ada <b>dua</b>, bukan satu. Papan punya empat tepi: dua panjang, dua lebar.": "There are <b>two</b> long sides, not one. The board has four edges: two long, two short.",
  "Sisi lebarnya juga ada dua. 80 + 80, bukan 80 saja.": "There are two short sides too. 80 + 80, not just 80.",
  "Itu <i>luas</i> papan, bukan keliling. Keliling adalah panjang lis yang mengelilingi tepinya.": "That's the board's <i>area</i>, not its perimeter. The perimeter is the length of trim that goes round its edge.",
  "Belum cocok. Telusuri tepinya satu per satu sambil menuliskannya: <span class=\"math\">p</span>, lalu 80, lalu <span class=\"math\">p</span> lagi, lalu 80 lagi. Baru jumlahkan.": "Not quite. Trace the edges one by one while writing them down: <span class=\"math\">l</span>, then 80, then <span class=\"math\">l</span> again, then 80 again. Only then add them up.",
  "<b>n = {v}.</b> Jadi satu kotak berisi {v} ekor. Perhatikan yang barusan kamu lakukan: kamu tidak pernah “memindahkan” apa pun. Kamu menerapkan operasi yang sama pada dua ruas sekaligus, dan neraca tetap seimbang di setiap langkah. Itulah satu-satunya alasan langkahmu sah.": "<b>n = {v}.</b> So one box holds {v} fish. Look at what you just did: you never “moved” anything. You applied the same operation to both sides at once, and the balance stayed level at every step. That is the only reason your steps are valid.",
  "Catatan: kamu sempat memakai jalan pintas “pindah ruas”. Hasilnya kebetulan sama, tapi kamu tidak bisa menjelaskan <i>kenapa</i> boleh — dan itu bedanya hafal dengan paham.": "Note: you used the “move across” shortcut at one point. The result happened to be the same, but you can't explain <i>why</i> it's allowed — and that is the difference between memorising and understanding.",
  "− 2 kedua ruas": "− 2 both sides",
  "+ 2 kedua ruas": "+ 2 both sides",
  "÷ 3 kedua ruas": "÷ 3 both sides",
  "× 3 kedua ruas": "× 3 both sides",
  "− 2 KIRI saja": "− 2 LEFT only",
  "− 2 pada ruas KIRI saja": "− 2 on the LEFT side only",
  "Neraca langsung miring. Kamu mengambil 2 dari satu sisi tanpa mengambil 2 dari sisi lain, jadi kedua sisi tidak lagi bernilai sama — persamaannya rusak. Aku kembalikan.": "The balance tips straight away. You took 2 from one side without taking 2 from the other, so the two sides no longer have the same value — the equation is broken. I'll put it back.",
  "“pindah ruas”": "“move across”",
  "“pindahkan 2 ke kanan”": "“move 2 to the right”",
  "Angkanya jadi benar — dan justru itu masalahnya. “Memindahkan lalu mengganti tanda” adalah <i>deskripsi</i> tentang apa yang terlihat di kertas, bukan <i>alasan</i> kenapa boleh. Yang sebenarnya terjadi: kamu mengurangi 2 dari <b>kedua</b> ruas sekaligus. Tombol “− 2 kedua ruas” melakukan hal yang persis sama, dengan alasan yang bisa kamu ucapkan.": "The number comes out right — and that's exactly the problem. “Move it across and change the sign” is a <i>description</i> of what you see on paper, not a <i>reason</i> why it's allowed. What really happens: you subtract 2 from <b>both</b> sides at once. The “− 2 both sides” button does exactly the same thing, with a reason you can say out loud.",
  "Benar, 11 lembar. Rp 47.000 − Rp 25.000 = Rp 22.000 untuk kertas, lalu dibagi Rp 2.000 per lembar.": "Correct, 11 sheets. Rp 47,000 − Rp 25,000 = Rp 22,000 for paper, then divided by Rp 2,000 per sheet.",
  "Kamu membagi seluruh uang kas dengan 2.000. Papan sterofoam Rp 25.000 dibeli sekali dan tidak bergantung banyaknya lembar — harus dikeluarkan dulu sebelum dibagi.": "You divided all the class money by 2,000. The Rp 25,000 polystyrene board is bought once and doesn't depend on the number of sheets — it has to be taken out before dividing.",
  "Kamu menambahkan Rp 25.000, bukan mengurangkannya. Harga papan itu bagian <i>dari</i> Rp 47.000 yang dikeluarkan, bukan tambahan di atasnya.": "You added Rp 25,000 instead of subtracting it. The price of the board is part <i>of</i> the Rp 47,000 spent, not something on top of it.",
  "Belum tepat. Bagian mana dari Rp 47.000 yang <i>tidak</i> bergantung pada banyaknya lembar kertas? Keluarkan bagian itu dulu.": "Not quite. Which part of the Rp 47,000 does <i>not</i> depend on the number of sheets of paper? Take that part out first.",
  "Tulis rumusnya.": "Write the formula.",
  "Tepat. <span class=\"math\">L = (B − 25000) / 2000</span>. Ini rumus yang <b>sama</b> dengan sebelumnya, hanya dibaca dari arah berlawanan — bukan rumus baru yang perlu dihafal terpisah.": "Exactly. <span class=\"math\">s = (C − 25000) / 2000</span>. This is the <b>same</b> formula as before, just read in the opposite direction — not a new formula to memorise separately.",
  "Urutan pengurangannya terbalik. Total biaya selalu lebih besar daripada harga papan, jadi banyak lembarnya akan keluar negatif.": "The subtraction is the wrong way round. The total cost is always bigger than the price of the board, so the number of sheets would come out negative.",
  "Kamu membagi dulu baru mengurangi. Urutannya harus dibalik dari rumus asal: pada <span class=\"math\">B = 25000 + 2000L</span>, yang <i>terakhir</i> ditambahkan harus yang <i>pertama</i> dibatalkan.": "You divided first and subtracted afterwards. The order has to be reversed from the original formula: in <span class=\"math\">C = 25000 + 2000s</span>, what was added <i>last</i> must be the <i>first</i> to be undone.",
  "Tanpa kurung, yang terbagi hanya angka 25000. Bagian <span class=\"math\">B − 25000</span> harus dibagi seluruhnya.": "Without brackets, only the number 25000 gets divided. The whole part <span class=\"math\">C − 25000</span> has to be divided.",
  "Belum cocok. Mulai dari <span class=\"math\">B = 25000 + 2000L</span> dan batalkan satu per satu: apa yang menempel pada <span class=\"math\">L</span>, dan dengan operasi apa?": "Not quite. Start from <span class=\"math\">C = 25000 + 2000s</span> and undo it step by step: what is attached to <span class=\"math\">s</span>, and by which operation?",
  "Aku bingung. Menurutku tanda “=” itu artinya “hasilnya”. Jadi kalau ditulis 3n + 2 = 26, ya 26 itu jawabannya. Berarti kalau ditulis 26 = 3n + 2, itu kebalik dong — salah tulis?": "I'm confused. I think the “=” sign means “the answer is”. So if you write 3n + 2 = 26, then 26 is the answer. That means if you write 26 = 3n + 2, it's back to front — a mistake, right?",
  "Apa sebenarnya yang diklaim tanda “=”? Coba jelaskan tanpa memakai kata “hasilnya”.": "What does the “=” sign actually claim? Try to explain without using the words “the answer is”.",
  "Mulai kalimatmu dengan: “tanda = berarti kedua ruas …”. Lanjutkan sendiri.": "Start your sentence with: “the = sign means both sides …”. Carry on yourself.",
  "Hmm. Jadi maksudmu ruas kiri dan ruas kanan itu dua cara menulis bilangan yang <i>sama</i>? Tapi kalau memang sama, kenapa ditulisnya beda begitu?": "Hmm. So you mean the left side and the right side are two ways of writing the <i>same</i> number? But if they really are the same, why are they written so differently?",
  "Kalau dua sisi memang bernilai sama, apakah urutan kiri–kanan masih penting?": "If the two sides really have the same value, does the left–right order still matter?",
  "Sebut satu kata kuncinya saja: apakah kiri–kanan boleh <i>ditukar</i> atau tidak?": "Just name the key word: can left and right be <i>swapped</i> or not?",
  "Oke… kalau cuma dua cara menulis bilangan yang sama, berarti dibalik pun tetap benar ya. Tapi aku belum sreg. Coba buktikan pakai angka beneran.": "Okay… if it's just two ways of writing the same number, then it's still true even when flipped round. But I'm not convinced yet. Prove it with real numbers.",
  "Ambil n = 8. Hitung nilai ruas kiri, lalu nilai ruas kanan. Tunjukkan angkanya ke Budi.": "Take n = 8. Work out the value of the left side, then the value of the right side. Show Budi the numbers.",
  "Tulis begini: “kalau n = 8, ruas kiri = … dan ruas kanan = …”. Isi kedua titik-titiknya dengan angka.": "Write it like this: “if n = 8, the left side = … and the right side = …”. Fill both gaps with numbers.",
  "Aku ikut hitung: 3 × 8 + 2 = 26, dan ruas kanan juga 26. Sama persis. Baiklah, angkanya memang cocok.": "I'll work it out too: 3 × 8 + 2 = 26, and the right side is 26 as well. Exactly the same. All right, the numbers really do match.",
  "Oke, aku mengerti sekarang. Tanda “=” bukan tombol “hasilnya” — itu klaim bahwa dua sisi bernilai sama. Karena cuma klaim tentang nilai, ditulis dari arah mana pun artinya tetap sama. Makasih ya.": "Okay, I get it now. The “=” sign isn't an “answer” button — it's a claim that two sides have the same value. Since it's only a claim about value, it means the same whichever way round it's written. Thanks.",
  "Tapi di kalkulator, aku pencet “=” lalu keluar hasilnya. Kok di sini beda?": "But on a calculator I press “=” and the answer comes out. Why is it different here?",
  "Kalau “=” bukan berarti “hasilnya”, terus untuk apa dong tanda itu ditulis?": "If “=” doesn't mean “the answer is”, then what's the point of writing it at all?",
  "Kalau memang boleh dibalik, kenapa buku selalu menaruh jawaban di sebelah kanan?": "If it really can be flipped, why do books always put the answer on the right?",
  "Coba pakai kalimat yang lebih sederhana, aku belum menangkapnya.": "Try simpler words, I haven't got it yet.",
  "Menurutku 2 + 3n itu bisa disederhanakan jadi 5n. Kan 2 + 3 = 5, terus n-nya tinggal dibawa. Sama kayak 2 ikan + 3 ikan = 5 ikan.": "I think 2 + 3n can be simplified to 5n. I mean 2 + 3 = 5, then you just bring the n along. Same as 2 fish + 3 fish = 5 fish.",
  "Apakah angka 2 dan bentuk 3n itu benda sejenis? Perhatikan: yang satu sudah diketahui, yang satu belum.": "Are the number 2 and the term 3n the same kind of thing? Notice: one is already known, the other isn't yet.",
  "Bandingkan dua hal ini: angka 2 sudah diketahui nilainya, sedangkan 3n belum. Apa sebutannya?": "Compare these two: the value of 2 is already known, while 3n isn't yet. What do we call that?",
  "Oh iya… 2 itu benar-benar dua, sedangkan 3n itu tiga kali sesuatu yang belum ketahuan. Tapi tetap saja rasanya aneh membiarkan jawaban tidak selesai.": "Oh right… 2 really is two, while 3n is three times something we don't know yet. But it still feels weird to leave an answer unfinished.",
  "Apakah sebuah jawaban aljabar wajib berupa satu suku tunggal? Bolehkah berhenti dalam bentuk terbuka?": "Must an algebra answer be a single term? Is it allowed to stop in an open form?",
  "Jawab pertanyaan ini dengan satu kalimat: bolehkah jawaban akhir masih memuat huruf?": "Answer this question in one sentence: may a final answer still contain a letter?",
  "Hmm, jadi 2 + 3n itu memang sudah bentuk akhirnya. Tapi aku masih belum yakin. Buktikan dong pakai angka — coba masukkan sebuah nilai untuk n.": "Hmm, so 2 + 3n really is the final form. But I'm still not sure. Prove it with numbers — try putting in a value for n.",
  "Pilih sebuah nilai untuk n, lalu hitung 2 + 3n dan 5n. Hati-hati: jangan pilih n = 1.": "Pick a value for n, then work out 2 + 3n and 5n. Careful: don't pick n = 1.",
  "Tulis begini: “kalau n = 4 maka 2 + 3n = … sedangkan 5n = …”. Isi angkanya.": "Write it like this: “if n = 4 then 2 + 3n = … while 5n = …”. Fill in the numbers.",
  "Aku ikut hitung. Untuk n = 4: 2 + 3×4 = 14, sedangkan 5×4 = 20. Beda jauh. Angkanya memang tidak cocok.": "I'll work it out too. For n = 4: 2 + 3×4 = 14, while 5×4 = 20. Way off. The numbers really don't match.",
  "Oke, aku salah. Kalau 2 + 3n benar-benar sama dengan 5n, harusnya cocok untuk <i>semua</i> nilai n, bukan cuma kebetulan satu. Dan karena 2 sudah diketahui sedangkan 3n belum, keduanya memang tidak bisa disatukan — bentuk terbuka itu sudah jawaban akhirnya. Makasih.": "Okay, I was wrong. If 2 + 3n were really equal to 5n, it would have to work for <i>every</i> value of n, not just one by luck. And since 2 is known while 3n isn't, they really can't be merged — the open form is already the final answer. Thanks.",
  "Tapi 2 ikan + 3 ikan jelas 5 ikan. Kenapa huruf tidak boleh diperlakukan begitu?": "But 2 fish + 3 fish is obviously 5 fish. Why can't letters be treated like that?",
  "Guruku bilang jawaban harus disederhanakan. Kalau dibiarkan 2 + 3n, itu belum sederhana dong?": "My teacher says answers have to be simplified. If you leave it as 2 + 3n, it isn't simplified, is it?",
  "Aku masih menganggap 2 dan 3n itu sejenis. Yakinkan aku kenapa tidak.": "I still think 2 and 3n are the same kind. Convince me why not.",
  "Coba pakai contoh angka, mungkin aku lebih mudah paham.": "Try an example with numbers, maybe that'll make it easier for me.",
  "Aku": "Me",
  "Budi memegang miskonsepsi <b>{kode} — {nama}</b>. Dia tidak akan berubah pikiran hanya karena kamu menulis jawaban benar.": "Budi holds the misconception <b>{kode} — {nama}</b>. He won't change his mind just because you write the right answer.",
  "Di bahasa ini Budi tidak menilai kata-katamu — ia menunggu kamu menjawab setiap poinnya. Hanya bukti angka yang tetap diperiksa.": "In this language Budi doesn't judge your words — he waits for you to answer each of his points. Only the number proof is still checked.",
  "<b>Poin Budi berikutnya:</b> {hint}": "<b>Budi's next point:</b> {hint}",
  "Aku coba n = 1: 2 + 3×1 = 5, dan 5×1 = 5. Sama! Berarti aku benar dong? …atau jangan-jangan n = 1 itu kebetulan? Coba angka lain.": "I'll try n = 1: 2 + 3×1 = 5, and 5×1 = 5. The same! So I'm right, aren't I? …or maybe n = 1 is just a coincidence? Try another number.",
  "Tulis argumen yang lebih panjang — Budi tidak bisa dibujuk dengan satu kata.": "Write a longer argument — Budi can't be won over with a single word.",
  "Model bahasa tidak bisa dihubungi ({e}). Budi otomatis kembali ke mesin aturan offline — media tetap berjalan.": "The language model can't be reached ({e}). Budi automatically switches back to the offline rule engine — the media keeps running.",
  "Budi menerima poin itu — <b>{n} dari {t}</b> hal sudah ia terima. Masih ada yang mengganjal.": "Budi accepts that point — he has accepted <b>{n} of {t}</b> things. Something still bothers him.",
  "<b>Petunjuk:</b> {isi}": "<b>Hint:</b> {isi}",
  "Budi berubah pikiran. Yang membuatnya berubah bukan jawaban benarmu, melainkan <b>alasanmu</b>. Debat topik ini selesai — pilih topik lain di atas, atau tekan <b>Ulangi debat</b>.": "Budi changed his mind. What changed it wasn't your right answer but <b>your reasoning</b>. This debate topic is finished — choose another topic above, or press <b>Repeat debate</b>.",
  "Budi sudah yakin — tidak ada lagi yang perlu dibuktikan di topik ini.": "Budi is already convinced — there's nothing left to prove in this topic.",

  "<b>Cara membaca lembar ini.</b> Yang penting bukan berapa jawaban yang benar, melainkan <i>jenis</i> kekeliruannya. Kode M1–M6 pada kolom umpan balik menunjuk pola salah paham yang terdeteksi, dan Peta Miskonsepsi di halaman pertama merangkumnya. Status “pulih setelah keliru” berarti siswa sempat memegang salah paham itu lalu berhasil meluruskannya sendiri — itu hasil belajar, bukan kesalahan.": "<b>How to read this sheet.</b> What matters isn't how many answers were right, but the <i>kind</i> of mistake. The codes M1–M6 in the feedback column point to the misconception patterns detected, and the Misconception Map on the first page sums them up. The status “recovered after going wrong” means the student held that misconception for a while and then straightened it out on their own — that is learning, not a mistake.",

  "Keduanya <b>tidak dijumlahkan</b> — kode konsep mengukur apakah salah pahamnya sudah teratasi, kode latihan mengukur apakah soalnya sudah lancar. Seorang siswa bisa lancar mengerjakan soal tapi tetap memegang salah paham; itu justru temuan yang berguna.": "The two are <b>not added together</b> — concept codes measure whether the misconception has been resolved, practice codes measure whether the problems are done fluently. A student can do the problems fluently and still hold the misconception; that is exactly the useful finding.",

  "Contoh percakapan satu kelas dimuat — berisi kode konsep dan kode latihan bercampur, seperti di grup WhatsApp sungguhan. Tekan <b>Baca kode</b>.": "A sample chat from one class has been loaded — concept codes and practice codes mixed together, just like a real WhatsApp group. Press <b>Read codes</b>.",

  "Huruf itu bukan singkatan.<br>Tanda <span style=\"color:var(--teal)\">=</span> itu bukan perintah.": "A letter is not an abbreviation.<br>The <span style=\"color:var(--teal)\">=</span> sign is not a command.",
  "Dua salah paham itu bertahan sampai SMA. Media ini tidak mengajarkan cara menjawab soal aljabar — media ini membongkar dua salah paham tersebut, lalu memeriksa apakah benar-benar sudah hilang.": "Those two misconceptions last into upper secondary school. This media doesn't teach how to answer algebra questions — it takes those two misconceptions apart, then checks whether they have really gone.",
  "Konteks: pasar bandeng · papan mading · kas kelas": "Setting: milkfish market · notice board · class funds",
  "Bantuan AI: teman sebaya &amp; diagnostik": "AI help: peer &amp; diagnostics",
  "Berjalan tanpa internet": "Works without internet",
  "Mulai dari awal": "Start over",
  "<b>Draft v0.4 — Modul 1 dari dua modul.</b> Modul ini dikerjakan <b>di dalam kelas</b>. Pos 1 dan 2 memakai kotak bandeng: benda tersegel yang isinya benar-benar tidak bisa dilihat. Item 1.5 lalu berpindah ke papan mading sekolah — dan di situlah <b>Modul 2 · Pindai &amp; Ukur</b> mengambil alih, dikerjakan <b>di depan papan yang sebenarnya</b> lewat kamera HP.": "<b>Draft v0.4 — Module 1 of two modules.</b> This module is done <b>in the classroom</b>. Stations 1 and 2 use milkfish boxes: sealed objects whose contents really can't be seen. Item 1.5 then moves to the school notice board — and that's where <b>Module 2 · Scan &amp; Measure</b> takes over, done <b>in front of the real board</b> with a phone camera.",
  "Kotak Bandeng": "Milkfish Boxes",
  "Neraca Kesetaraan": "Balance of Equality",
  "Yakinkan Budi": "Convince Budi",
  "Peta &amp; Bekal": "Map &amp; Kit",
  "Buka semua pos (untuk guru)": "Open all stations (for teachers)",
  "Pos 1 · Pasar Bandeng, Ungaran": "Station 1 · Milkfish Market, Ungaran",
  "Kamu belanja di Pasar Bandeng. Ikan dijual dalam <b>kotak tersegel</b> — dan segel itu tidak boleh dibuka di lapak. Isinya benar-benar tidak diketahui siapa pun sampai kotaknya sampai di rumah.": "You're shopping at the Milkfish Market. The fish are sold in <b>sealed boxes</b> — and the seal may not be opened at the stall. Nobody knows what's inside until the box gets home.",
  "1.1 Beri nama pada yang belum dihitung <span class=\"tag\">M1 · M6</span>": "1.1 Name what hasn't been counted <span class=\"tag\">M1 · M6</span>",
  "Kita butuh cara menulis \"banyak ikan di dalam satu kotak\" tanpa tahu angkanya.": "We need a way to write \"the number of fish in one box\" without knowing the number.",
  "Misalkan": "Let",
  "= banyak ikan di dalam <b>satu</b> kotak.": "= the number of fish in <b>one</b> box.",
  "Periksa": "Check",
  "1.2 Susun belanjaanmu <span class=\"tag\">M2</span>": "1.2 Put your shopping together <span class=\"tag\">M2</span>",
  "Selain kotak, ada juga <b>ikan satuan</b> — ikan yang dijual sendiri-sendiri di luar kotak, jadi jumlahnya sudah terhitung sejak awal. Ubah jumlahnya, lalu tulis ekspresi untuk <b>total ikan</b> yang kamu bawa pulang.": "Besides the boxes, there are also <b>single fish</b> — fish sold one by one outside the boxes, so their number is counted from the start. Change the amounts, then write an expression for the <b>total fish</b> you take home.",
  "<i style=\"background:#c1740c\"></i>kotak tersegel — isi belum diketahui": "<i style=\"background:#c1740c\"></i>sealed box — contents unknown",
  "<i style=\"background:#7d8a91\"></i>ikan satuan — sudah terhitung, di luar kotak": "<i style=\"background:#7d8a91\"></i>single fish — already counted, outside the boxes",
  "Buka satu kotak": "Open one box",
  "Total ikan =": "Total fish =",
  "<b>Kenapa tidak bisa disatukan?</b> Ikan di dalam kotak dan ikan satuan dihitung dengan cara berbeda — yang satu jumlahnya belum diketahui, yang satu sudah. Ekspresi aljabar boleh berhenti dalam keadaan \"belum selesai\" seperti itu.": "<b>Why can't they be merged?</b> Fish inside the boxes and single fish are counted in different ways — one amount is unknown, the other is known. An algebraic expression is allowed to stop in an \"unfinished\" state like that.",
  "1.3 Sampai di rumah, kotaknya dibuka <span class=\"tag\">M6</span>": "1.3 Home at last, the box is opened <span class=\"tag\">M6</span>",
  "Setiap kali kamu menekan <b>Buka satu kotak</b> di atas, isinya berbeda. Ekspresimu tetap benar — itulah gunanya huruf.": "Every time you press <b>Open one box</b> above, the contents are different. Your expression stays correct — that's what letters are for.",
  "Jika ternyata satu kotak berisi": "If one box turns out to hold",
  "ekor, total ikannya =": "fish, the total number of fish =",
  "1.4 Jelaskan dengan kalimatmu sendiri <span class=\"tag\">diagnostik AI</span>": "1.4 Explain in your own words <span class=\"tag\">AI diagnostics</span>",
  "Jawaban ini tidak dinilai benar atau salah. Yang dibaca adalah <i>cara berpikirmu</i>.": "This answer isn't marked right or wrong. What's being read is <i>how you think</i>.",
  "Adik kelasmu belum pernah belajar aljabar. Dia bertanya: <b>“Kak, <span class=\"math\">3k</span> itu apa artinya?”</b><br> Jelaskan kepadanya dengan kalimatmu sendiri — jangan dijawab pakai rumus.": "A younger student has never learned algebra. They ask: <b>“What does <span class=\"math\">3b</span> mean?”</b><br> Explain it to them in your own words — don't answer with a formula.",
  "Pengingat: <span class=\"math\">k</span> = banyak ikan di dalam <b>satu</b> kotak.": "Reminder: <span class=\"math\">b</span> = the number of fish in <b>one</b> box.",
  "Kirim": "Send",
  "1.5 Sekarang tengok dinding kelasmu <span class=\"tag\">M2</span>": "1.5 Now look at your classroom wall <span class=\"tag\">M2</span>",
  "Yang belum diketahui tidak harus berupa isi kotak. Papan mading sekolahmu berbentuk persegi panjang; lebarnya sudah diukur, <b>80 cm</b>, tapi panjangnya belum sempat diukur — sebut saja <span class=\"math\">p</span> cm.": "What's unknown doesn't have to be the contents of a box. Your school notice board is a rectangle; its width has been measured, <b>80 cm</b>, but its length hasn't been measured yet — let's call it <span class=\"math\">l</span> cm.",
  "Panitia mau memasang lis kertas mengelilingi seluruh tepi papan. Berapa panjang lis yang dibutuhkan?": "The committee wants to put a paper trim all the way round the edge of the board. How long does the trim need to be?",
  "Keliling =": "Perimeter =",
  "<b>Di sini kelas berhenti, lapangan dimulai.</b> Barusan lebar papan sudah diberikan kepadamu: 80 cm. Di papan yang sebenarnya, tidak ada yang memberimu angka itu.": "<b>This is where the classroom stops and the field begins.</b> Just now the width of the board was given to you: 80 cm. At the real board, nobody gives you that number.",
  "Modul 2 · Di luar kelas": "Module 2 · Outside the classroom",
  "Pindai &amp; Ukur papan mading yang sebenarnya": "Scan &amp; Measure the real notice board",
  "Bawa HP ke koridor. Kamera memindai papan mading, mengenali bahwa bangunnya bersisi empat, lalu menyusun sendiri rumus <span class=\"math\">K = 2p + 2l</span> — <b>tanpa</b> tahu ukurannya. Angkanya harus datang dari meteranmu. Setelah kamu mengukur, media memeriksa apakah hasil ukurmu masuk akal terhadap bentuk yang dilihat kamera.": "Take a phone into the corridor. The camera scans the notice board, recognises that the shape has four sides, then builds the formula <span class=\"math\">P = 2l + 2w</span> by itself — <b>without</b> knowing its size. The numbers have to come from your tape measure. After you measure, the media checks whether your measurements make sense against the shape the camera saw.",
  "Buka Modul 2 →": "Open Module 2 →",
  "Pos 2 · Relasi kesetaraan": "Station 2 · The equality relation",
  "Tanda <span class=\"math\"><b>=</b></span> bukan perintah \"hitung sekarang\". Tanda itu berkata: dua sisi ini sama beratnya. Apa pun yang kamu lakukan pada satu sisi, sisi lain harus mengalami hal yang sama.": "The <span class=\"math\"><b>=</b></span> sign is not a \"calculate now\" command. It says: these two sides weigh the same. Whatever you do to one side, the other side has to undergo the same thing.",
  "2.1 Berapa isi satu kotak? <span class=\"tag\">M3 · M4</span>": "2.1 How many are in one box? <span class=\"tag\">M3 · M4</span>",
  "Kamu membeli 3 kotak dan 2 ikan satuan. Setelah semuanya dihitung di rumah, ternyata ada 26 ekor. Buat <span class=\"math\">n</span> sendirian di satu sisi.": "You buy 3 boxes and 2 single fish. After counting everything at home, there are 26 fish. Get <span class=\"math\">n</span> on its own on one side.",
  "− 2 &nbsp;(kedua ruas)": "− 2 &nbsp;(both sides)",
  "÷ 3 &nbsp;(kedua ruas)": "÷ 3 &nbsp;(both sides)",
  "+ 2 &nbsp;(kedua ruas)": "+ 2 &nbsp;(both sides)",
  "× 3 &nbsp;(kedua ruas)": "× 3 &nbsp;(both sides)",
  "− 2 &nbsp;(ruas kiri saja)": "− 2 &nbsp;(left side only)",
  "pindahkan 2 ke kanan": "move 2 to the right",
  "↺ Mulai lagi": "↺ Start again",
  "Target: <span class=\"math\">n</span> sendirian di ruas kiri.": "Target: <span class=\"math\">n</span> on its own on the left side.",
  "2.2 Anggaran mading <span class=\"tag\">M3 · M4</span>": "2.2 Notice board budget <span class=\"tag\">M3 · M4</span>",
  "Papan sterofoam dibeli sekali seharga <b>Rp 25.000</b>. Kertas warna <b>Rp 2.000</b> per lembar. Jadi total biaya <span class=\"math\">B = 25000 + 2000L</span>, dengan <span class=\"math\">L</span> = banyak lembar kertas.": "A polystyrene board is bought once for <b>Rp 25,000</b>. Coloured paper costs <b>Rp 2,000</b> per sheet. So the total cost is <span class=\"math\">C = 25000 + 2000s</span>, where <span class=\"math\">s</span> = the number of sheets of paper.",
  "Kas kelas tersisa Rp 47.000 dan dihabiskan seluruhnya. Berapa lembar kertas yang terbeli?": "The class fund has Rp 47,000 left and all of it is spent. How many sheets of paper were bought?",
  "<span class=\"math\">L</span> =": "<span class=\"math\">s</span> =",
  "lembar": "sheets",
  "Sekarang tulis rumusnya terbalik: dari biaya, hitung banyak lembar.": "Now write the formula the other way round: from the cost, work out the number of sheets.",
  "Pos 3 · Teman sebaya AI": "Station 3 · AI classmate",
  "Budi satu panitia mading denganmu, dan sedang salah paham. Tugasmu bukan menjawab soal — tugasmu <b>meyakinkan Budi</b>. Dia tidak akan mengalah hanya karena kamu menulis jawaban yang benar.": "Budi is on the notice board committee with you, and he has a misconception. Your task isn't to answer a question — your task is to <b>convince Budi</b>. He won't give in just because you write the right answer.",
  "Topik perdebatan:": "Debate topic:",
  "Arti tanda =": "Meaning of the = sign",
  "2 + 3n = 5n?": "2 + 3n = 5n?",

  "Kirim ke Budi": "Send to Budi",
  "Aku butuh petunjuk": "I need a hint",

  "Mesin percakapan": "Conversation engine",
  "Secara bawaan Budi berjalan <b>sepenuhnya offline</b> memakai mesin aturan yang membaca argumenmu terhadap taksonomi miskonsepsi. Tidak butuh internet, tidak butuh biaya, dan tidak pernah gagal saat demo. Jika guru mengisi kunci API di bawah, Budi berganti ke model bahasa dan bisa berdebat lebih luwes — dengan instruksi terkunci: <b>Budi tidak pernah boleh memberi jawaban akhir.</b>": "By default Budi runs <b>fully offline</b> with a rule engine that reads your arguments against the misconception taxonomy. No internet, no cost, and it never fails during a demo. If the teacher fills in an API key below, Budi switches to a language model and can debate more flexibly — with locked instructions: <b>Budi must never give the final answer.</b>",
  "Aktifkan": "Turn on",
  "Matikan": "Turn off",
  "Pos 4 · Diagnostik": "Station 4 · Diagnostics",
  "Setiap jawabanmu — benar maupun salah — dicocokkan dengan enam pola salah paham yang sudah didefinisikan. Bukan skor, melainkan peta: apa yang sudah beres, apa yang masih perlu dikerjakan.": "Every answer you give — right or wrong — is matched against six defined misconception patterns. Not a score, but a map: what's already sorted, and what still needs work.",
  "Perjalananmu": "Your journey",
  "Perhatikan cara poin ini dihitung: <b>memperbaiki jawaban yang sempat keliru dibayar lebih mahal daripada benar sejak awal.</b> Itu bukan kekeliruan sistem — memang itu yang ingin dihargai.": "Notice how these points are counted: <b>fixing an answer that was wrong earns more than being right from the start.</b> That's not a system error — it's exactly what we want to reward.",

  "Lembar kerja berisi <b>seluruh percobaanmu</b> — termasuk yang keliru — beserta umpan balik yang kamu terima. Justru percobaan yang keliru itulah yang paling berguna bagi gurumu.": "The worksheet contains <b>all your attempts</b> — including the wrong ones — along with the feedback you received. The wrong attempts are actually the most useful ones for your teacher.",
  "Simpan sebagai PDF": "Save as PDF",
  "Pada dialog cetak, pilih tujuan <b>“Simpan sebagai PDF”</b>.": "In the print dialog, choose the destination <b>“Save as PDF”</b>.",
  "Kirim kode ke gurumu <span class=\"tag\">KODE JEJAK</span>": "Send a code to your teacher <span class=\"tag\">KODE JEJAK</span>",
  "Kode pendek ini merangkum <b>pola</b> pengerjaanmu — bukan nama, bukan jawaban, bukan identitas apa pun. Kirimkan ke grup WhatsApp kelas supaya gurumu tahu apa yang perlu diulang besok.": "This short code sums up the <b>pattern</b> of your work — not your name, not your answers, not any identity at all. Send it to the class WhatsApp group so your teacher knows what to revisit tomorrow.",
  "Buat kode": "Make code",
  "Salin": "Copy",
  "Pindah ke perangkat lain": "Move to another device",
  "Ganti HP, atau pindah ke komputer lab? Buat <b>kode simpan</b>, catat atau kirim ke dirimu sendiri, lalu tempel di perangkat baru. Kode ini membawa kemajuanmu — <b>bukan</b> riwayat jawaban, jadi cetak Lembar Kerja PDF dulu kalau masih dibutuhkan.": "Changing phones, or moving to a lab computer? Make a <b>save code</b>, write it down or send it to yourself, then paste it on the new device. This code carries your progress — <b>not</b> your answer history, so print the PDF Worksheet first if you still need it.",

  "Panel Guru — peta satu kelas <span class=\"tag\">KODE JEJAK</span>": "Teacher Panel — one class map <span class=\"tag\">KODE JEJAK</span>",
  "Salin <b>seluruh percakapan</b> grup WhatsApp kelas apa adanya, lalu tempel di bawah. Panel menyaring sendiri kode yang sah dari teks yang berantakan. Tanpa server, tanpa akun, tanpa satu pun nama siswa ikut terbaca.": "Copy the <b>whole chat</b> of the class WhatsApp group as it is, then paste it below. The panel filters out the valid codes from the messy text by itself. No server, no accounts, and not a single student name gets read.",
  "Baca kode": "Read codes",

  "Kosongkan": "Clear",
  "Panel Guru — kartu lapangan <span class=\"tag\">MODUL 2</span>": "Teacher Panel — field cards <span class=\"tag\">MODULE 2</span>",
  "Siswa mengirim <b>kartu hasil</b> Modul 2 ke grup WhatsApp sebagai foto. Simpan gambarnya, lalu seret ke kotak di bawah, pilih berkasnya, atau klik kotaknya dan tempel (Ctrl+V). Datanya dibaca dari pita kotak hitam-putih di bawah kartu — tetap terbaca walau WhatsApp memampatkan fotonya.": "Students send their Module 2 <b>result cards</b> to the WhatsApp group as photos. Save the images, then drag them into the box below, choose the files, or click the box and paste (Ctrl+V). The data is read from the black-and-white strip of squares at the bottom of the card — it stays readable even when WhatsApp compresses the photo.",
  "Foto siswa <b>tidak disimpan</b> di perangkat ini: begitu halaman ditutup, semuanya hilang.": "Students' photos are <b>not saved</b> on this device: once the page is closed, they're all gone.",
  "<b>Seret kartu lapangan ke sini</b>atau klik kotak ini lalu tempel gambarnya": "<b>Drag field cards here</b>or click this box, then paste the image",
  "Pilih gambar…": "Choose images…",
  "<b>Kenapa ini bukan sekadar \"skor\".</b> Media yang hanya menghitung benar–salah tidak bisa membedakan siswa yang salah karena ceroboh dan siswa yang salah karena strukturnya belum terbentuk. Taksonomi M1–M6 memaksa medianya menjawab pertanyaan yang benar: <i>salahnya jenis apa?</i>": "<b>Why this isn't just a \"score\".</b> Media that only counts right and wrong can't tell a student who's wrong through carelessness from a student who's wrong because the structure hasn't formed yet. The M1–M6 taxonomy forces the media to answer the right question: <i>what kind of wrong is it?</i>",
  "<b>JEJAK ALJABAR · Modul 1 — Di dalam kelas</b> — draft media untuk KMPM 2026 · Muhammad Ghozian Kafi Ahsan<br> Dikembangkan dari worksheet <i>Algebraic Modelling: Expressions &amp; Formulae</i> (Local Instructional Theory, kelas IX). Konteks: pasar bandeng (Pos 1–2), papan mading dan kas kelas — benda yang tersedia di setiap sekolah.<br> Modul 2 (<i>Pindai &amp; Ukur</i>) adalah berkas terpisah — simpan keduanya dalam <b>satu folder</b> agar tautannya berfungsi.": "<b>JEJAK ALJABAR · Module 1 — In the classroom</b> — media draft for KMPM 2026 · Muhammad Ghozian Kafi Ahsan<br> Developed from the worksheet <i>Algebraic Modelling: Expressions &amp; Formulae</i> (Local Instructional Theory, grade IX). Settings: a milkfish market (Stations 1–2), a notice board and class funds — things found in every school.<br> Module 2 (<i>Scan &amp; Measure</i>) is a separate file — keep both in <b>one folder</b> so the links work.",

  "Kotak dibuka — ternyata isinya <span class=\"big\">{v}</span> ekor. Jadi kali ini <span class=\"math\">{h} = {v}</span>, dan totalnya <b>{t}</b> ekor.": "盒子打开了——原来里面有 <span class=\"big\">{v}</span> 条。所以这一次 <span class=\"math\">{h} = {v}</span>，总共是 <b>{t}</b> 条。",
  "Tekan lagi — isinya akan berbeda. Huruf <span class=\"math\">{h}</span> tidak menyimpan satu angka rahasia; ia menampung <i>berapa pun</i> isinya.": "再按一次——里面的数量会不一样。字母 <span class=\"math\">{h}</span> 并不藏着一个秘密数字；它能容纳<i>任何</i>数量。",
  "Isi dulu satu huruf.": "请先填一个字母。",
  "Angka justru yang sedang tidak kita ketahui. Kita butuh <i>lambang</i> untuk menampungnya.": "数字恰恰是我们还不知道的东西。我们需要一个<i>符号</i>来容纳它。",
  "Gunakan <b>satu</b> huruf saja. Menulis “kotak” atau “bandeng” membuat lambang itu terbaca sebagai singkatan sebuah benda — padahal yang diwakilinya adalah <i>banyaknya</i> ikan, sebuah bilangan.": "只用<b>一个</b>字母。写“盒”或“鱼”会让这个符号读起来像某样东西的缩写——但它代表的是鱼的<i>数量</i>，是一个数。",
  "Pakai huruf a–z.": "请用 a–z 的字母。",
  "Bagus. Mulai sekarang <span class=\"math\">{h}</span> berarti <b>banyaknya ikan</b> di dalam satu kotak — sebuah bilangan, bukan nama benda.": "很好。从现在起，<span class=\"math\">{h}</span> 表示一盒里<b>鱼的条数</b>——是一个数，不是东西的名字。",
  "Selesaikan langkah 1.1 dulu — kita belum punya huruf untuk dipakai.": "请先完成 1.1——我们还没有可以用的字母。",
  "Tulis ekspresinya dulu.": "请先写出式子。",
  "Tepat. <span class=\"math\">{e}</span> — bagian yang belum diketahui dan bagian yang sudah diketahui berdiri berdampingan, tidak dipaksa menyatu.": "完全正确。<span class=\"math\">{e}</span>——未知的部分和已知的部分并排而立，没有被强行合并。",
  "Kamu menjumlahkan <b>{a}</b> dengan <b>{b}</b> lalu membawa hurufnya. Coba uji: kalau satu kotak berisi 10 ekor, jawabanmu memberi {salah} ekor — padahal kamu hanya punya {benar} ekor. Ikan satuan tidak ikut berlipat ketika isi kotak bertambah.": "你把 <b>{a}</b> 和 <b>{b}</b> 相加，再把字母带上。检验一下：如果一盒有 10 条，你的答案给出 {salah} 条——可你只有 {benar} 条。盒子里的数量变多时，单条鱼并不会跟着成倍增加。",
  "Kamu memperlakukan satu kotak seolah berisi satu ekor. Padahal isi satu kotak itulah yang belum diketahui — dan jumlahnya bisa berapa pun.": "你把一盒当成只有一条鱼。可一盒里有多少正是未知的——它可以是任何数量。",
  "Tandanya terbalik. Ikan satuan itu kamu <i>bawa pulang juga</i>, bukan kamu berikan pada orang lain.": "符号反了。那些单条鱼你也<i>一起带回家</i>，并不是送给别人。",
  "Ikan satuannya belum masuk hitungan. Ada {n} ekor lagi di luar kotak.": "单条鱼还没算进去。盒子外面还有 {n} 条。",
  "Tulis memakai huruf, angka, dan tanda + − × ÷ ( ) saja.": "只用字母、数字和 + − × ÷ ( ) 这些符号来写。",
  "Benar. Kamu memakai huruf <span class=\"math\">{dari}</span>, sedangkan di langkah 1.1 kamu memilih <span class=\"math\">{h}</span> — hurufnya bebas, jadi ini tidak salah. Tapi sekali sebuah huruf dipilih, pakailah huruf itu terus supaya pembacamu tidak bingung.": "正确。你用的是字母 <span class=\"math\">{dari}</span>，而在 1.1 你选的是 <span class=\"math\">{h}</span>——字母可以自由选，所以这不算错。但一旦选定了字母，就一直用它，免得读的人糊涂。",
  "Yang membuat ekspresi ini benar bukan hurufnya, melainkan strukturnya: {a} kelompok berisi jumlah yang sama, ditambah {b} ekor yang berdiri sendiri.": "让这个式子正确的不是字母，而是结构：{a} 组数量相同的鱼，再加上单独的 {b} 条。",
  "Kamu memakai huruf <span class=\"math\">{dari}</span>, bukan <span class=\"math\">{h}</span> yang kamu pilih di langkah 1.1. Hurufnya sendiri boleh berbeda — tetapi ekspresimu memang belum cocok, bahkan setelah hurufnya disamakan.": "你用的是字母 <span class=\"math\">{dari}</span>，而不是你在 1.1 选的 <span class=\"math\">{h}</span>。字母本身可以不同——但即使把字母统一，你的式子还是不对。",
  "Hitung dua bagian secara terpisah: berapa ikan <i>di dalam kotak</i>, lalu berapa yang <i>di luar</i>.": "把两部分分开数：<i>盒子里</i>有多少条，再数<i>外面</i>有多少条。",
  "Belum cocok. Hitung dua bagian secara terpisah: berapa ikan yang ada <i>di dalam kotak</i>, lalu berapa yang <i>di luar kotak</i>. Jumlahkan keduanya tanpa menyatukannya.": "还不对。把两部分分开数：<i>盒子里</i>有多少条，再数<i>盒子外面</i>有多少条。把它们相加，但不要合并成一项。",
  "Selesaikan langkah 1.1 dulu.": "请先完成 1.1。",
  "Isi dengan sebuah angka.": "请填一个数。",
  "Benar — {n} ekor. Perhatikan: ekspresimu tidak berubah sama sekali. Yang berubah hanya nilai yang <i>dititipkan</i> ke dalam <span class=\"math\">{h}</span>. Itulah alasan huruf lebih berguna daripada angka.": "正确——{n} 条。注意：你的式子一点都没变。变的只是<i>放进</i> <span class=\"math\">{h}</span> 里的值。这就是字母比数字更有用的原因。",
  "Kamu mengalikan ikan satuan dengan isi kotak juga. Yang berlipat hanya isi kotak.": "你把单条鱼也乘上了盒子里的数量。只有盒子里的数量才要乘。",
  "Itu isi <b>satu</b> kotak. Ada {a} kotak, ditambah {b} ikan satuan.": "那只是<b>一盒</b>里的数量。一共有 {a} 盒，再加上 {b} 条单条鱼。",
  "Belum tepat. Ganti setiap <span class=\"math\">{h}</span> pada ekspresimu dengan {v}, lalu hitung.": "还不对。把式子里的每个 <span class=\"math\">{h}</span> 都换成 {v}，再计算。",
  "Tulis minimal satu kalimat utuh — mesin diagnostik butuh alasanmu, bukan satu kata.": "至少写一个完整的句子——诊断引擎需要的是你的理由，而不是一个词。",
  "Penjelasanmu tercatat di Lembar Kerja untuk dibaca gurumu.": "你的解释已记录在学习单上，供老师阅读。",
  "Pemeriksaan otomatis jawaban terbuka hanya tersedia dalam bahasa Indonesia, jadi penjelasan ini tidak dinilai.": "开放式答案的自动检查只支持印度尼西亚语，所以这段解释不评分。",
  "Tepat. <span class=\"math\">p + p + 80 + 80 = 2p + 160</span>. Dua sisi panjang belum diketahui sehingga tetap ditulis sebagai <span class=\"math\">2p</span>, dua sisi lebar sudah diketahui sehingga menjadi 160. Keduanya berdiri berdampingan.": "完全正确。<span class=\"math\">a + a + 80 + 80 = 2a + 160</span>。两条长边还不知道，所以仍写成 <span class=\"math\">2a</span>；两条宽边已经知道，所以变成 160。两部分并排而立。",
  "Kamu menyatukan yang belum diketahui dengan yang sudah diketahui. Uji dengan p = 100: papan 100 × 80 cm punya keliling 360 cm, tapi jawabanmu memberi angka yang jauh berbeda.": "你把未知的和已知的合并在一起了。用 a = 100 检验：100 × 80 cm 的板周长是 360 cm，但你的答案给出的数相差很远。",
  "Sisi panjangnya ada <b>dua</b>, bukan satu. Papan punya empat tepi: dua panjang, dua lebar.": "长边有<b>两条</b>，不是一条。板有四条边：两条长，两条宽。",
  "Sisi lebarnya juga ada dua. 80 + 80, bukan 80 saja.": "宽边也有两条。是 80 + 80，不只是 80。",
  "Itu <i>luas</i> papan, bukan keliling. Keliling adalah panjang lis yang mengelilingi tepinya.": "那是板的<i>面积</i>，不是周长。周长是绕着边缘一圈的边条长度。",
  "Belum cocok. Telusuri tepinya satu per satu sambil menuliskannya: <span class=\"math\">p</span>, lalu 80, lalu <span class=\"math\">p</span> lagi, lalu 80 lagi. Baru jumlahkan.": "还不对。沿着边一条一条地描，一边写下来：<span class=\"math\">a</span>，然后 80，再一个 <span class=\"math\">a</span>，再一个 80。然后才相加。",
  "<b>n = {v}.</b> Jadi satu kotak berisi {v} ekor. Perhatikan yang barusan kamu lakukan: kamu tidak pernah “memindahkan” apa pun. Kamu menerapkan operasi yang sama pada dua ruas sekaligus, dan neraca tetap seimbang di setiap langkah. Itulah satu-satunya alasan langkahmu sah.": "<b>n = {v}。</b>所以一盒有 {v} 条。看看你刚才做了什么：你从没“移动”任何东西。你对两边同时做了同样的运算，天平在每一步都保持平衡。这正是你的每一步都成立的唯一理由。",
  "Catatan: kamu sempat memakai jalan pintas “pindah ruas”. Hasilnya kebetulan sama, tapi kamu tidak bisa menjelaskan <i>kenapa</i> boleh — dan itu bedanya hafal dengan paham.": "注意：你曾用过“移项”这个捷径。结果碰巧一样，但你说不出它<i>为什么</i>可以——这就是死记和理解的区别。",
  "− 2 kedua ruas": "两边 − 2",
  "+ 2 kedua ruas": "两边 + 2",
  "÷ 3 kedua ruas": "两边 ÷ 3",
  "× 3 kedua ruas": "两边 × 3",
  "− 2 KIRI saja": "只在左边 − 2",
  "− 2 pada ruas KIRI saja": "只在左边 − 2",
  "Neraca langsung miring. Kamu mengambil 2 dari satu sisi tanpa mengambil 2 dari sisi lain, jadi kedua sisi tidak lagi bernilai sama — persamaannya rusak. Aku kembalikan.": "天平马上倾斜了。你从一边拿走 2，却没从另一边也拿走 2，所以两边不再相等——等式被破坏了。我把它恢复原样。",
  "“pindah ruas”": "“移项”",
  "“pindahkan 2 ke kanan”": "“把 2 移到右边”",
  "Angkanya jadi benar — dan justru itu masalahnya. “Memindahkan lalu mengganti tanda” adalah <i>deskripsi</i> tentang apa yang terlihat di kertas, bukan <i>alasan</i> kenapa boleh. Yang sebenarnya terjadi: kamu mengurangi 2 dari <b>kedua</b> ruas sekaligus. Tombol “− 2 kedua ruas” melakukan hal yang persis sama, dengan alasan yang bisa kamu ucapkan.": "数字是对的——而这恰恰是问题所在。“移过去再变号”只是对纸面上看到的现象的<i>描述</i>，不是它为什么可以的<i>理由</i>。真正发生的是：你同时从<b>两边</b>减去 2。“两边 − 2”按钮做的是完全一样的事，而且有你能说出口的理由。",
  "Benar, 11 lembar. Rp 47.000 − Rp 25.000 = Rp 22.000 untuk kertas, lalu dibagi Rp 2.000 per lembar.": "正确，11 张。Rp 47,000 − Rp 25,000 = Rp 22,000 用来买纸，再除以每张 Rp 2,000。",
  "Kamu membagi seluruh uang kas dengan 2.000. Papan sterofoam Rp 25.000 dibeli sekali dan tidak bergantung banyaknya lembar — harus dikeluarkan dulu sebelum dibagi.": "你把班费全部除以 2,000。Rp 25,000 的泡沫板只买一次，与纸的张数无关——必须先把它扣除再除。",
  "Kamu menambahkan Rp 25.000, bukan mengurangkannya. Harga papan itu bagian <i>dari</i> Rp 47.000 yang dikeluarkan, bukan tambahan di atasnya.": "你把 Rp 25,000 加上了，而不是减去。板的价钱是所花的 Rp 47,000 <i>里面</i>的一部分，不是额外加上的。",
  "Belum tepat. Bagian mana dari Rp 47.000 yang <i>tidak</i> bergantung pada banyaknya lembar kertas? Keluarkan bagian itu dulu.": "还不对。Rp 47,000 里哪一部分<i>不</i>取决于纸的张数？先把那部分扣除。",
  "Tulis rumusnya.": "请写出公式。",
  "Tepat. <span class=\"math\">L = (B − 25000) / 2000</span>. Ini rumus yang <b>sama</b> dengan sebelumnya, hanya dibaca dari arah berlawanan — bukan rumus baru yang perlu dihafal terpisah.": "完全正确。<span class=\"math\">x = (y − 25000) / 2000</span>。这和之前是<b>同一个</b>公式，只是从相反方向读——不是需要另外背的新公式。",
  "Urutan pengurangannya terbalik. Total biaya selalu lebih besar daripada harga papan, jadi banyak lembarnya akan keluar negatif.": "减法顺序反了。总费用总是比板的价钱大，所以张数会算成负数。",
  "Kamu membagi dulu baru mengurangi. Urutannya harus dibalik dari rumus asal: pada <span class=\"math\">B = 25000 + 2000L</span>, yang <i>terakhir</i> ditambahkan harus yang <i>pertama</i> dibatalkan.": "你先除后减。顺序必须和原公式相反：在 <span class=\"math\">y = 25000 + 2000x</span> 中，<i>最后</i>加上的，必须<i>最先</i>撤销。",
  "Tanpa kurung, yang terbagi hanya angka 25000. Bagian <span class=\"math\">B − 25000</span> harus dibagi seluruhnya.": "没有括号的话，被除的只有 25000。必须把 <span class=\"math\">y − 25000</span> 整个都除。",
  "Belum cocok. Mulai dari <span class=\"math\">B = 25000 + 2000L</span> dan batalkan satu per satu: apa yang menempel pada <span class=\"math\">L</span>, dan dengan operasi apa?": "还不对。从 <span class=\"math\">y = 25000 + 2000x</span> 出发，一步一步撤销：什么附着在 <span class=\"math\">x</span> 上，用的是什么运算？",
  "Aku bingung. Menurutku tanda “=” itu artinya “hasilnya”. Jadi kalau ditulis 3n + 2 = 26, ya 26 itu jawabannya. Berarti kalau ditulis 26 = 3n + 2, itu kebalik dong — salah tulis?": "我糊涂了。我觉得“=”的意思是“结果是”。所以写 3n + 2 = 26，那 26 就是答案。那如果写成 26 = 3n + 2，不就反了吗——写错了吧？",
  "Apa sebenarnya yang diklaim tanda “=”? Coba jelaskan tanpa memakai kata “hasilnya”.": "“=”到底在声明什么？试着不用“结果是”这几个字来解释。",
  "Mulai kalimatmu dengan: “tanda = berarti kedua ruas …”. Lanjutkan sendiri.": "用这句话开头：“等号的意思是两边……”。自己接着写。",
  "Hmm. Jadi maksudmu ruas kiri dan ruas kanan itu dua cara menulis bilangan yang <i>sama</i>? Tapi kalau memang sama, kenapa ditulisnya beda begitu?": "嗯。你的意思是左边和右边是写<i>同一个</i>数的两种方法？可如果真的相同，为什么写法这么不一样？",
  "Kalau dua sisi memang bernilai sama, apakah urutan kiri–kanan masih penting?": "如果两边的值真的相同，左右的顺序还重要吗？",
  "Sebut satu kata kuncinya saja: apakah kiri–kanan boleh <i>ditukar</i> atau tidak?": "只说出关键词：左右可以<i>交换</i>吗？",
  "Oke… kalau cuma dua cara menulis bilangan yang sama, berarti dibalik pun tetap benar ya. Tapi aku belum sreg. Coba buktikan pakai angka beneran.": "好吧……如果只是写同一个数的两种方法，那反过来写也还是对的。可我还是不太服气。用真正的数字证明一下。",
  "Ambil n = 8. Hitung nilai ruas kiri, lalu nilai ruas kanan. Tunjukkan angkanya ke Budi.": "取 n = 8。算出左边的值，再算出右边的值。把数字给 Budi 看。",
  "Tulis begini: “kalau n = 8, ruas kiri = … dan ruas kanan = …”. Isi kedua titik-titiknya dengan angka.": "这样写：“如果 n = 8，左边 = ……，右边 = ……”。在两个空里填上数字。",
  "Aku ikut hitung: 3 × 8 + 2 = 26, dan ruas kanan juga 26. Sama persis. Baiklah, angkanya memang cocok.": "我也算一下：3 × 8 + 2 = 26，右边也是 26。一模一样。好吧，数字确实对得上。",
  "Oke, aku mengerti sekarang. Tanda “=” bukan tombol “hasilnya” — itu klaim bahwa dua sisi bernilai sama. Karena cuma klaim tentang nilai, ditulis dari arah mana pun artinya tetap sama. Makasih ya.": "好，我现在明白了。“=”不是“出结果”的按钮——它是在声明两边的值相等。既然只是关于值的声明，从哪边写意思都一样。谢谢你。",
  "Tapi di kalkulator, aku pencet “=” lalu keluar hasilnya. Kok di sini beda?": "可是在计算器上，我按“=”就出结果。为什么这里不一样？",
  "Kalau “=” bukan berarti “hasilnya”, terus untuk apa dong tanda itu ditulis?": "如果“=”不是“结果是”的意思，那写它干什么？",
  "Kalau memang boleh dibalik, kenapa buku selalu menaruh jawaban di sebelah kanan?": "如果真的可以反过来，为什么课本总把答案放在右边？",
  "Coba pakai kalimat yang lebih sederhana, aku belum menangkapnya.": "用简单一点的话说吧，我还没听懂。",
  "Menurutku 2 + 3n itu bisa disederhanakan jadi 5n. Kan 2 + 3 = 5, terus n-nya tinggal dibawa. Sama kayak 2 ikan + 3 ikan = 5 ikan.": "我觉得 2 + 3n 可以化简成 5n。你看 2 + 3 = 5，然后把 n 带上就行。就像 2 条鱼 + 3 条鱼 = 5 条鱼。",
  "Apakah angka 2 dan bentuk 3n itu benda sejenis? Perhatikan: yang satu sudah diketahui, yang satu belum.": "数字 2 和 3n 是同一类东西吗？注意：一个已经知道，另一个还不知道。",
  "Bandingkan dua hal ini: angka 2 sudah diketahui nilainya, sedangkan 3n belum. Apa sebutannya?": "比较这两个：2 的值已经知道，而 3n 还不知道。这叫什么？",
  "Oh iya… 2 itu benar-benar dua, sedangkan 3n itu tiga kali sesuatu yang belum ketahuan. Tapi tetap saja rasanya aneh membiarkan jawaban tidak selesai.": "哦对……2 就是实实在在的二，而 3n 是某个还不知道的数的三倍。可是让答案停在没算完的样子，还是觉得怪怪的。",
  "Apakah sebuah jawaban aljabar wajib berupa satu suku tunggal? Bolehkah berhenti dalam bentuk terbuka?": "代数答案一定要是单独一项吗？可以停在开放的形式吗？",
  "Jawab pertanyaan ini dengan satu kalimat: bolehkah jawaban akhir masih memuat huruf?": "用一句话回答：最终答案可以含有字母吗？",
  "Hmm, jadi 2 + 3n itu memang sudah bentuk akhirnya. Tapi aku masih belum yakin. Buktikan dong pakai angka — coba masukkan sebuah nilai untuk n.": "嗯，所以 2 + 3n 已经是最终形式了。可我还是不确定。用数字证明吧——给 n 代一个值试试。",
  "Pilih sebuah nilai untuk n, lalu hitung 2 + 3n dan 5n. Hati-hati: jangan pilih n = 1.": "给 n 选一个值，然后算出 2 + 3n 和 5n。小心：不要选 n = 1。",
  "Tulis begini: “kalau n = 4 maka 2 + 3n = … sedangkan 5n = …”. Isi angkanya.": "这样写：“如果 n = 4，那么 2 + 3n = ……，而 5n = ……”。填上数字。",
  "Aku ikut hitung. Untuk n = 4: 2 + 3×4 = 14, sedangkan 5×4 = 20. Beda jauh. Angkanya memang tidak cocok.": "我也算一下。n = 4 时：2 + 3×4 = 14，而 5×4 = 20。差得很远。数字确实对不上。",
  "Oke, aku salah. Kalau 2 + 3n benar-benar sama dengan 5n, harusnya cocok untuk <i>semua</i> nilai n, bukan cuma kebetulan satu. Dan karena 2 sudah diketahui sedangkan 3n belum, keduanya memang tidak bisa disatukan — bentuk terbuka itu sudah jawaban akhirnya. Makasih.": "好吧，我错了。如果 2 + 3n 真的等于 5n，那它应该对<i>所有</i>的 n 都成立，而不只是碰巧一个。而且 2 已经知道、3n 还不知道，两者确实不能合并——开放的形式就是最终答案。谢谢。",
  "Tapi 2 ikan + 3 ikan jelas 5 ikan. Kenapa huruf tidak boleh diperlakukan begitu?": "可是 2 条鱼 + 3 条鱼明明是 5 条鱼。为什么字母不能这样算？",
  "Guruku bilang jawaban harus disederhanakan. Kalau dibiarkan 2 + 3n, itu belum sederhana dong?": "老师说答案要化简。如果留着 2 + 3n，那不就是没化简吗？",
  "Aku masih menganggap 2 dan 3n itu sejenis. Yakinkan aku kenapa tidak.": "我还是觉得 2 和 3n 是同类。说服我为什么不是。",
  "Coba pakai contoh angka, mungkin aku lebih mudah paham.": "用数字举个例子吧，也许我更容易懂。",
  "Aku": "我",
  "Budi memegang miskonsepsi <b>{kode} — {nama}</b>. Dia tidak akan berubah pikiran hanya karena kamu menulis jawaban benar.": "Budi 抱着误解 <b>{kode}——{nama}</b>。他不会因为你写出正确答案就改变想法。",
  "Di bahasa ini Budi tidak menilai kata-katamu — ia menunggu kamu menjawab setiap poinnya. Hanya bukti angka yang tetap diperiksa.": "在这种语言下，Budi 不评判你的用词——他等你回应他的每一个论点。只有数字证明仍会被检查。",
  "<b>Poin Budi berikutnya:</b> {hint}": "<b>Budi 的下一个论点：</b>{hint}",
  "Aku coba n = 1: 2 + 3×1 = 5, dan 5×1 = 5. Sama! Berarti aku benar dong? …atau jangan-jangan n = 1 itu kebetulan? Coba angka lain.": "我试试 n = 1：2 + 3×1 = 5，5×1 = 5。一样！那我是对的吧？……还是说 n = 1 只是巧合？换个数试试。",
  "Tulis argumen yang lebih panjang — Budi tidak bisa dibujuk dengan satu kata.": "写一个更长的论证——一个词说服不了 Budi。",
  "Model bahasa tidak bisa dihubungi ({e}). Budi otomatis kembali ke mesin aturan offline — media tetap berjalan.": "无法连接语言模型（{e}）。Budi 自动切回离线规则引擎——媒体照常运行。",
  "Budi menerima poin itu — <b>{n} dari {t}</b> hal sudah ia terima. Masih ada yang mengganjal.": "Budi 接受了这一点——<b>{t} 点中已接受 {n} 点</b>。还有疙瘩没解开。",

  "Budi berubah pikiran. Yang membuatnya berubah bukan jawaban benarmu, melainkan <b>alasanmu</b>. Debat topik ini selesai — pilih topik lain di atas, atau tekan <b>Ulangi debat</b>.": "Budi 改变了想法。让他改变的不是你的正确答案，而是<b>你的理由</b>。这个辩论话题结束了——在上面选别的话题，或按<b>重新辩论</b>。",

  "<b>Cara membaca lembar ini.</b> Yang penting bukan berapa jawaban yang benar, melainkan <i>jenis</i> kekeliruannya. Kode M1–M6 pada kolom umpan balik menunjuk pola salah paham yang terdeteksi, dan Peta Miskonsepsi di halaman pertama merangkumnya. Status “pulih setelah keliru” berarti siswa sempat memegang salah paham itu lalu berhasil meluruskannya sendiri — itu hasil belajar, bukan kesalahan.": "<b>如何阅读本学习单。</b>重要的不是答对了多少，而是错误的<i>类型</i>。反馈栏中的 M1–M6 代码指向检测到的误解模式，第一页的误解地图对它们做了汇总。“出错后已恢复”表示学生曾经抱有这个误解，后来自己纠正了——这是学习的成果，不是错误。",

  "Kamu belanja di Pasar Bandeng. Ikan dijual dalam <b>kotak tersegel</b> — dan segel itu tidak boleh dibuka di lapak. Isinya benar-benar tidak diketahui siapa pun sampai kotaknya sampai di rumah.": "你在虱目鱼市场买东西。鱼装在<b>密封的盒子</b>里出售——摊位上不能拆封。盒子到家之前，谁也不知道里面有多少条。",
  "1.1 Beri nama pada yang belum dihitung <span class=\"tag\">M1 · M6</span>": "1.1 给还没数的东西取名 <span class=\"tag\">M1 · M6</span>",
  "Kita butuh cara menulis \"banyak ikan di dalam satu kotak\" tanpa tahu angkanya.": "我们需要一种方法，在不知道具体数字的情况下写出“一盒里鱼的条数”。",

  "1.2 Susun belanjaanmu <span class=\"tag\">M2</span>": "1.2 整理你买的东西 <span class=\"tag\">M2</span>",
  "Selain kotak, ada juga <b>ikan satuan</b> — ikan yang dijual sendiri-sendiri di luar kotak, jadi jumlahnya sudah terhitung sejak awal. Ubah jumlahnya, lalu tulis ekspresi untuk <b>total ikan</b> yang kamu bawa pulang.": "除了盒子，还有<b>单条鱼</b>——在盒子外一条一条单独卖的鱼，所以数量一开始就数好了。改变数量，然后写出你带回家的<b>鱼的总数</b>的式子。",
  "<i style=\"background:#c1740c\"></i>kotak tersegel — isi belum diketahui": "<i style=\"background:#c1740c\"></i>密封的盒子——里面有多少还不知道",
  "<i style=\"background:#7d8a91\"></i>ikan satuan — sudah terhitung, di luar kotak": "<i style=\"background:#7d8a91\"></i>单条鱼——已经数好，在盒子外",

  "<b>Kenapa tidak bisa disatukan?</b> Ikan di dalam kotak dan ikan satuan dihitung dengan cara berbeda — yang satu jumlahnya belum diketahui, yang satu sudah. Ekspresi aljabar boleh berhenti dalam keadaan \"belum selesai\" seperti itu.": "<b>为什么不能合并？</b>盒子里的鱼和单条鱼的计数方式不同——一个数量未知，一个已知。代数式可以停在这样“没算完”的状态。",

  "Adik kelasmu belum pernah belajar aljabar. Dia bertanya: <b>“Kak, <span class=\"math\">3k</span> itu apa artinya?”</b><br> Jelaskan kepadanya dengan kalimatmu sendiri — jangan dijawab pakai rumus.": "一个学弟学妹还没学过代数。他问：<b>“<span class=\"math\">3h</span> 是什么意思？”</b><br>用你自己的话向他解释——不要用公式回答。",
  "Pengingat: <span class=\"math\">k</span> = banyak ikan di dalam <b>satu</b> kotak.": "提醒：<span class=\"math\">h</span> = <b>一</b>盒里鱼的条数。",

  "Yang belum diketahui tidak harus berupa isi kotak. Papan mading sekolahmu berbentuk persegi panjang; lebarnya sudah diukur, <b>80 cm</b>, tapi panjangnya belum sempat diukur — sebut saja <span class=\"math\">p</span> cm.": "未知的东西不一定是盒子里的数量。学校的布告栏是长方形的；宽已经量过，是 <b>80 cm</b>，但长还没来得及量——就叫它 <span class=\"math\">a</span> cm 吧。",

  "Gunakan <b>satu</b> huruf saja. Menulis “kotak” atau “bandeng” membuat lambang itu terbaca sebagai singkatan sebuah benda — padahal yang diwakilinya adalah <i>banyaknya</i> ikan, sebuah bilangan.": "문자 <b>하나</b>만 쓰세요. “상자”나 “생선”이라고 쓰면 그 기호가 물건 이름의 줄임말처럼 읽혀요 — 하지만 그것이 나타내는 건 생선의 <i>개수</i>, 즉 수예요.",
  "Pakai huruf a–z.": "a–z 중 문자를 쓰세요.",
  "Bagus. Mulai sekarang <span class=\"math\">{h}</span> berarti <b>banyaknya ikan</b> di dalam satu kotak — sebuah bilangan, bukan nama benda.": "좋아요. 이제부터 <span class=\"math\">{h}</span>는 상자 하나에 든 <b>생선의 수</b>를 뜻해요 — 물건 이름이 아니라 수예요.",
  "Selesaikan langkah 1.1 dulu — kita belum punya huruf untuk dipakai.": "먼저 1.1을 끝내세요 — 아직 쓸 문자가 없어요.",
  "Tulis ekspresinya dulu.": "먼저 식을 쓰세요.",
  "Tepat. <span class=\"math\">{e}</span> — bagian yang belum diketahui dan bagian yang sudah diketahui berdiri berdampingan, tidak dipaksa menyatu.": "정확해요. <span class=\"math\">{e}</span> — 모르는 부분과 아는 부분이 나란히 서 있고, 억지로 합쳐지지 않았어요.",
  "Kamu menjumlahkan <b>{a}</b> dengan <b>{b}</b> lalu membawa hurufnya. Coba uji: kalau satu kotak berisi 10 ekor, jawabanmu memberi {salah} ekor — padahal kamu hanya punya {benar} ekor. Ikan satuan tidak ikut berlipat ketika isi kotak bertambah.": "<b>{a}</b>와 <b>{b}</b>를 더하고 문자를 그대로 붙였어요. 확인해 보세요: 상자 하나에 10마리가 들어 있으면 답은 {salah}마리가 되지만, 실제로는 {benar}마리뿐이에요. 상자 안의 수가 늘어도 낱개 생선은 함께 불어나지 않아요.",
  "Kamu memperlakukan satu kotak seolah berisi satu ekor. Padahal isi satu kotak itulah yang belum diketahui — dan jumlahnya bisa berapa pun.": "상자 하나에 생선이 한 마리 들어 있는 것처럼 다루었어요. 하지만 상자 하나에 든 수가 바로 모르는 값이에요 — 몇 마리든 될 수 있어요.",
  "Tandanya terbalik. Ikan satuan itu kamu <i>bawa pulang juga</i>, bukan kamu berikan pada orang lain.": "부호가 거꾸로예요. 낱개 생선도 <i>함께 집에 가져가는</i> 거지, 남에게 주는 게 아니에요.",
  "Ikan satuannya belum masuk hitungan. Ada {n} ekor lagi di luar kotak.": "낱개 생선을 아직 세지 않았어요. 상자 밖에 {n}마리가 더 있어요.",
  "Tulis memakai huruf, angka, dan tanda + − × ÷ ( ) saja.": "문자, 숫자, 그리고 + − × ÷ ( ) 기호만 써서 적으세요.",
  "Benar. Kamu memakai huruf <span class=\"math\">{dari}</span>, sedangkan di langkah 1.1 kamu memilih <span class=\"math\">{h}</span> — hurufnya bebas, jadi ini tidak salah. Tapi sekali sebuah huruf dipilih, pakailah huruf itu terus supaya pembacamu tidak bingung.": "맞아요. 문자 <span class=\"math\">{dari}</span>를 썼는데, 1.1에서는 <span class=\"math\">{h}</span>를 골랐어요 — 문자는 자유롭게 고를 수 있으니 틀린 건 아니에요. 하지만 한번 문자를 골랐으면 읽는 사람이 헷갈리지 않게 계속 그 문자를 쓰세요.",
  "Yang membuat ekspresi ini benar bukan hurufnya, melainkan strukturnya: {a} kelompok berisi jumlah yang sama, ditambah {b} ekor yang berdiri sendiri.": "이 식을 맞게 만드는 건 문자가 아니라 구조예요: 같은 수가 든 {a}묶음, 그리고 따로 있는 {b}마리.",
  "Kamu memakai huruf <span class=\"math\">{dari}</span>, bukan <span class=\"math\">{h}</span> yang kamu pilih di langkah 1.1. Hurufnya sendiri boleh berbeda — tetapi ekspresimu memang belum cocok, bahkan setelah hurufnya disamakan.": "1.1에서 고른 <span class=\"math\">{h}</span>가 아니라 문자 <span class=\"math\">{dari}</span>를 썼어요. 문자 자체는 달라도 돼요 — 하지만 문자를 같게 맞춰도 식이 아직 맞지 않아요.",
  "Hitung dua bagian secara terpisah: berapa ikan <i>di dalam kotak</i>, lalu berapa yang <i>di luar</i>.": "두 부분을 따로 세어 보세요: <i>상자 안</i>에 몇 마리, 그다음 <i>밖</i>에 몇 마리.",
  "Belum cocok. Hitung dua bagian secara terpisah: berapa ikan yang ada <i>di dalam kotak</i>, lalu berapa yang <i>di luar kotak</i>. Jumlahkan keduanya tanpa menyatukannya.": "아직 맞지 않아요. 두 부분을 따로 세어 보세요: <i>상자 안</i>에 몇 마리, 그다음 <i>상자 밖</i>에 몇 마리. 둘을 더하되 하나로 합치지는 마세요.",
  "Selesaikan langkah 1.1 dulu.": "먼저 1.1을 끝내세요.",
  "Isi dengan sebuah angka.": "숫자를 써 넣으세요.",
  "Benar — {n} ekor. Perhatikan: ekspresimu tidak berubah sama sekali. Yang berubah hanya nilai yang <i>dititipkan</i> ke dalam <span class=\"math\">{h}</span>. Itulah alasan huruf lebih berguna daripada angka.": "맞아요 — {n}마리. 잘 보세요: 식은 전혀 바뀌지 않았어요. 바뀐 건 <span class=\"math\">{h}</span>에 <i>넣은</i> 값뿐이에요. 그래서 문자가 숫자보다 쓸모 있어요.",
  "Kamu mengalikan ikan satuan dengan isi kotak juga. Yang berlipat hanya isi kotak.": "낱개 생선에도 상자 안의 수를 곱했어요. 곱해지는 건 상자 안의 수뿐이에요.",
  "Itu isi <b>satu</b> kotak. Ada {a} kotak, ditambah {b} ikan satuan.": "그건 상자 <b>하나</b>에 든 수예요. 상자가 {a}개 있고, 낱개 생선 {b}마리가 더 있어요.",
  "Belum tepat. Ganti setiap <span class=\"math\">{h}</span> pada ekspresimu dengan {v}, lalu hitung.": "아직 아니에요. 식에 있는 <span class=\"math\">{h}</span>를 모두 {v}로 바꾼 다음 계산하세요.",
  "Tulis minimal satu kalimat utuh — mesin diagnostik butuh alasanmu, bukan satu kata.": "적어도 완전한 문장 하나는 쓰세요 — 진단 엔진에는 낱말 하나가 아니라 이유가 필요해요.",
  "Penjelasanmu tercatat di Lembar Kerja untuk dibaca gurumu.": "설명이 활동지에 기록되어 선생님이 읽을 수 있어요.",
  "Pemeriksaan otomatis jawaban terbuka hanya tersedia dalam bahasa Indonesia, jadi penjelasan ini tidak dinilai.": "열린 답의 자동 확인은 인도네시아어로만 할 수 있어서, 이 설명은 채점하지 않아요.",
  "Tepat. <span class=\"math\">p + p + 80 + 80 = 2p + 160</span>. Dua sisi panjang belum diketahui sehingga tetap ditulis sebagai <span class=\"math\">2p</span>, dua sisi lebar sudah diketahui sehingga menjadi 160. Keduanya berdiri berdampingan.": "정확해요. <span class=\"math\">a + a + 80 + 80 = 2a + 160</span>. 긴 변 두 개는 아직 모르니까 <span class=\"math\">2a</span>로 남고, 짧은 변 두 개는 아니까 160이 돼요. 두 부분이 나란히 서 있어요.",
  "Kamu menyatukan yang belum diketahui dengan yang sudah diketahui. Uji dengan p = 100: papan 100 × 80 cm punya keliling 360 cm, tapi jawabanmu memberi angka yang jauh berbeda.": "모르는 것과 아는 것을 하나로 합쳤어요. a = 100으로 확인해 보세요: 100 × 80 cm 게시판의 둘레는 360 cm인데, 답은 전혀 다른 수가 나와요.",
  "Sisi panjangnya ada <b>dua</b>, bukan satu. Papan punya empat tepi: dua panjang, dua lebar.": "긴 변은 하나가 아니라 <b>두 개</b>예요. 게시판에는 가장자리가 네 개 있어요: 긴 변 둘, 짧은 변 둘.",
  "Sisi lebarnya juga ada dua. 80 + 80, bukan 80 saja.": "짧은 변도 두 개예요. 80만이 아니라 80 + 80이에요.",
  "Itu <i>luas</i> papan, bukan keliling. Keliling adalah panjang lis yang mengelilingi tepinya.": "그건 게시판의 둘레가 아니라 <i>넓이</i>예요. 둘레는 가장자리를 한 바퀴 두르는 테두리의 길이예요.",
  "Belum cocok. Telusuri tepinya satu per satu sambil menuliskannya: <span class=\"math\">p</span>, lalu 80, lalu <span class=\"math\">p</span> lagi, lalu 80 lagi. Baru jumlahkan.": "아직 아니에요. 가장자리를 하나씩 따라가며 적어 보세요: <span class=\"math\">a</span>, 그다음 80, 다시 <span class=\"math\">a</span>, 다시 80. 그런 다음 더하세요.",
  "<b>n = {v}.</b> Jadi satu kotak berisi {v} ekor. Perhatikan yang barusan kamu lakukan: kamu tidak pernah “memindahkan” apa pun. Kamu menerapkan operasi yang sama pada dua ruas sekaligus, dan neraca tetap seimbang di setiap langkah. Itulah satu-satunya alasan langkahmu sah.": "<b>n = {v}.</b> 그러니까 상자 하나에 {v}마리가 들어 있어요. 방금 한 일을 보세요: 아무것도 “옮기지” 않았어요. 양변에 같은 연산을 동시에 했고, 저울은 매 단계 균형을 유지했어요. 그것만이 각 단계가 타당한 이유예요.",
  "Catatan: kamu sempat memakai jalan pintas “pindah ruas”. Hasilnya kebetulan sama, tapi kamu tidak bisa menjelaskan <i>kenapa</i> boleh — dan itu bedanya hafal dengan paham.": "참고: 중간에 “이항” 지름길을 썼어요. 결과는 우연히 같았지만, <i>왜</i> 그래도 되는지 설명할 수 없어요 — 그게 외우는 것과 이해하는 것의 차이예요.",
  "− 2 kedua ruas": "양변 − 2",
  "+ 2 kedua ruas": "양변 + 2",
  "÷ 3 kedua ruas": "양변 ÷ 3",
  "× 3 kedua ruas": "양변 × 3",
  "− 2 KIRI saja": "왼쪽만 − 2",
  "− 2 pada ruas KIRI saja": "왼쪽 변에서만 − 2",
  "Neraca langsung miring. Kamu mengambil 2 dari satu sisi tanpa mengambil 2 dari sisi lain, jadi kedua sisi tidak lagi bernilai sama — persamaannya rusak. Aku kembalikan.": "저울이 바로 기울었어요. 한쪽에서 2를 빼고 다른 쪽에서는 빼지 않아서 양쪽 값이 더 이상 같지 않아요 — 등식이 깨졌어요. 원래대로 돌려 놓을게요.",
  "“pindah ruas”": "“이항”",
  "“pindahkan 2 ke kanan”": "“2를 오른쪽으로 옮기기”",
  "Angkanya jadi benar — dan justru itu masalahnya. “Memindahkan lalu mengganti tanda” adalah <i>deskripsi</i> tentang apa yang terlihat di kertas, bukan <i>alasan</i> kenapa boleh. Yang sebenarnya terjadi: kamu mengurangi 2 dari <b>kedua</b> ruas sekaligus. Tombol “− 2 kedua ruas” melakukan hal yang persis sama, dengan alasan yang bisa kamu ucapkan.": "숫자는 맞게 나와요 — 바로 그게 문제예요. “옮기고 부호를 바꾼다”는 종이에서 보이는 모습에 대한 <i>묘사</i>이지, 왜 그래도 되는지에 대한 <i>이유</i>가 아니에요. 실제로 일어나는 일은: <b>양변</b>에서 동시에 2를 빼는 거예요. “양변 − 2” 버튼은 똑같은 일을 하면서, 말로 설명할 수 있는 이유가 있어요.",
  "Benar, 11 lembar. Rp 47.000 − Rp 25.000 = Rp 22.000 untuk kertas, lalu dibagi Rp 2.000 per lembar.": "맞아요, 11장. Rp 47,000 − Rp 25,000 = Rp 22,000이 종이 값이고, 이걸 장당 Rp 2,000으로 나눠요.",
  "Kamu membagi seluruh uang kas dengan 2.000. Papan sterofoam Rp 25.000 dibeli sekali dan tidak bergantung banyaknya lembar — harus dikeluarkan dulu sebelum dibagi.": "학급비 전체를 2,000으로 나눴어요. Rp 25,000짜리 스티로폼 판은 한 번만 사고 종이 장수와 상관없어요 — 나누기 전에 먼저 빼야 해요.",
  "Kamu menambahkan Rp 25.000, bukan mengurangkannya. Harga papan itu bagian <i>dari</i> Rp 47.000 yang dikeluarkan, bukan tambahan di atasnya.": "Rp 25,000을 빼지 않고 더했어요. 판 값은 쓴 돈 Rp 47,000 <i>안에</i> 들어 있는 부분이지, 그 위에 더해지는 돈이 아니에요.",
  "Belum tepat. Bagian mana dari Rp 47.000 yang <i>tidak</i> bergantung pada banyaknya lembar kertas? Keluarkan bagian itu dulu.": "아직 아니에요. Rp 47,000 중 어느 부분이 종이 장수와 상관<i>없나요</i>? 그 부분을 먼저 빼세요.",
  "Tulis rumusnya.": "공식을 쓰세요.",
  "Tepat. <span class=\"math\">L = (B − 25000) / 2000</span>. Ini rumus yang <b>sama</b> dengan sebelumnya, hanya dibaca dari arah berlawanan — bukan rumus baru yang perlu dihafal terpisah.": "정확해요. <span class=\"math\">x = (y − 25000) / 2000</span>. 이건 앞의 공식과 <b>같은</b> 공식을 반대 방향에서 읽은 것일 뿐이에요 — 따로 외워야 하는 새 공식이 아니에요.",
  "Urutan pengurangannya terbalik. Total biaya selalu lebih besar daripada harga papan, jadi banyak lembarnya akan keluar negatif.": "뺄셈 순서가 거꾸로예요. 총비용은 언제나 판 값보다 크니까, 장수가 음수로 나와요.",
  "Kamu membagi dulu baru mengurangi. Urutannya harus dibalik dari rumus asal: pada <span class=\"math\">B = 25000 + 2000L</span>, yang <i>terakhir</i> ditambahkan harus yang <i>pertama</i> dibatalkan.": "먼저 나누고 나중에 뺐어요. 순서는 원래 공식과 반대여야 해요: <span class=\"math\">y = 25000 + 2000x</span>에서 <i>마지막</i>에 더한 것을 <i>가장 먼저</i> 되돌려야 해요.",
  "Tanpa kurung, yang terbagi hanya angka 25000. Bagian <span class=\"math\">B − 25000</span> harus dibagi seluruhnya.": "괄호가 없으면 25000만 나눠져요. <span class=\"math\">y − 25000</span> 전체를 나눠야 해요.",
  "Belum cocok. Mulai dari <span class=\"math\">B = 25000 + 2000L</span> dan batalkan satu per satu: apa yang menempel pada <span class=\"math\">L</span>, dan dengan operasi apa?": "아직 아니에요. <span class=\"math\">y = 25000 + 2000x</span>에서 시작해 하나씩 되돌려 보세요: <span class=\"math\">x</span>에 무엇이, 어떤 연산으로 붙어 있나요?",
  "Aku bingung. Menurutku tanda “=” itu artinya “hasilnya”. Jadi kalau ditulis 3n + 2 = 26, ya 26 itu jawabannya. Berarti kalau ditulis 26 = 3n + 2, itu kebalik dong — salah tulis?": "헷갈려. 내 생각엔 “=”는 “답은”이라는 뜻이야. 그러니까 3n + 2 = 26이라고 쓰면 26이 답이지. 그럼 26 = 3n + 2라고 쓰면 거꾸로잖아 — 잘못 쓴 거 아니야?",
  "Apa sebenarnya yang diklaim tanda “=”? Coba jelaskan tanpa memakai kata “hasilnya”.": "“=”는 실제로 무엇을 주장할까요? “답은”이라는 말을 쓰지 않고 설명해 보세요.",
  "Mulai kalimatmu dengan: “tanda = berarti kedua ruas …”. Lanjutkan sendiri.": "“등호는 양변이 …라는 뜻이다”로 문장을 시작해 보세요. 뒤는 직접 이어 쓰세요.",
  "Hmm. Jadi maksudmu ruas kiri dan ruas kanan itu dua cara menulis bilangan yang <i>sama</i>? Tapi kalau memang sama, kenapa ditulisnya beda begitu?": "음. 그러니까 왼쪽 변과 오른쪽 변이 <i>같은</i> 수를 쓰는 두 가지 방법이라는 거야? 그런데 정말 같다면 왜 이렇게 다르게 쓰는 거야?",
  "Kalau dua sisi memang bernilai sama, apakah urutan kiri–kanan masih penting?": "양쪽 값이 정말 같다면, 왼쪽–오른쪽 순서가 여전히 중요할까요?",
  "Sebut satu kata kuncinya saja: apakah kiri–kanan boleh <i>ditukar</i> atau tidak?": "핵심 낱말 하나만 말해 보세요: 왼쪽과 오른쪽을 <i>바꿔도</i> 될까요, 안 될까요?",
  "Oke… kalau cuma dua cara menulis bilangan yang sama, berarti dibalik pun tetap benar ya. Tapi aku belum sreg. Coba buktikan pakai angka beneran.": "알았어… 같은 수를 쓰는 두 가지 방법일 뿐이라면, 뒤집어도 여전히 맞겠네. 그래도 아직 찜찜해. 진짜 숫자로 증명해 봐.",
  "Ambil n = 8. Hitung nilai ruas kiri, lalu nilai ruas kanan. Tunjukkan angkanya ke Budi.": "n = 8로 해 보세요. 왼쪽 변의 값을 구하고, 오른쪽 변의 값도 구하세요. Budi에게 숫자를 보여 주세요.",
  "Tulis begini: “kalau n = 8, ruas kiri = … dan ruas kanan = …”. Isi kedua titik-titiknya dengan angka.": "이렇게 쓰세요: “n = 8이면 왼쪽 변 = …이고 오른쪽 변 = …이다”. 빈칸 두 곳에 숫자를 넣으세요.",
  "Aku ikut hitung: 3 × 8 + 2 = 26, dan ruas kanan juga 26. Sama persis. Baiklah, angkanya memang cocok.": "나도 계산해 볼게: 3 × 8 + 2 = 26, 오른쪽 변도 26이야. 똑같네. 좋아, 숫자가 정말 맞아.",
  "Oke, aku mengerti sekarang. Tanda “=” bukan tombol “hasilnya” — itu klaim bahwa dua sisi bernilai sama. Karena cuma klaim tentang nilai, ditulis dari arah mana pun artinya tetap sama. Makasih ya.": "알겠어, 이제 이해했어. “=”는 “답 내기” 버튼이 아니라 — 양쪽 값이 같다는 주장이야. 값에 대한 주장일 뿐이니까 어느 쪽으로 써도 뜻은 같아. 고마워.",
  "Tapi di kalkulator, aku pencet “=” lalu keluar hasilnya. Kok di sini beda?": "그런데 계산기에서는 “=”를 누르면 답이 나오잖아. 여기서는 왜 달라?",
  "Kalau “=” bukan berarti “hasilnya”, terus untuk apa dong tanda itu ditulis?": "“=”가 “답은”이라는 뜻이 아니라면, 그럼 그 기호는 왜 쓰는 건데?",
  "Kalau memang boleh dibalik, kenapa buku selalu menaruh jawaban di sebelah kanan?": "정말 뒤집어도 된다면, 왜 책은 항상 답을 오른쪽에 둬?",
  "Coba pakai kalimat yang lebih sederhana, aku belum menangkapnya.": "좀 더 쉬운 말로 해 봐, 아직 잘 모르겠어.",
  "Menurutku 2 + 3n itu bisa disederhanakan jadi 5n. Kan 2 + 3 = 5, terus n-nya tinggal dibawa. Sama kayak 2 ikan + 3 ikan = 5 ikan.": "내 생각엔 2 + 3n은 5n으로 간단히 할 수 있어. 2 + 3 = 5니까 n만 붙이면 되잖아. 생선 2마리 + 생선 3마리 = 생선 5마리랑 똑같지.",
  "Apakah angka 2 dan bentuk 3n itu benda sejenis? Perhatikan: yang satu sudah diketahui, yang satu belum.": "숫자 2와 3n은 같은 종류일까요? 잘 보세요: 하나는 이미 알고, 하나는 아직 몰라요.",
  "Bandingkan dua hal ini: angka 2 sudah diketahui nilainya, sedangkan 3n belum. Apa sebutannya?": "이 둘을 비교해 보세요: 2는 값을 이미 알지만 3n은 아직 몰라요. 그걸 뭐라고 할까요?",
  "Oh iya… 2 itu benar-benar dua, sedangkan 3n itu tiga kali sesuatu yang belum ketahuan. Tapi tetap saja rasanya aneh membiarkan jawaban tidak selesai.": "아 맞다… 2는 진짜 둘이고, 3n은 아직 모르는 무언가의 세 배지. 그래도 답을 끝내지 않고 두는 건 여전히 이상한 기분이야.",
  "Apakah sebuah jawaban aljabar wajib berupa satu suku tunggal? Bolehkah berhenti dalam bentuk terbuka?": "대수의 답은 꼭 하나의 항이어야 할까요? 열린 형태로 멈춰도 될까요?",
  "Jawab pertanyaan ini dengan satu kalimat: bolehkah jawaban akhir masih memuat huruf?": "이 질문에 한 문장으로 답하세요: 최종 답에 문자가 남아 있어도 될까요?",
  "Hmm, jadi 2 + 3n itu memang sudah bentuk akhirnya. Tapi aku masih belum yakin. Buktikan dong pakai angka — coba masukkan sebuah nilai untuk n.": "음, 그러니까 2 + 3n이 정말 최종 형태라는 거지. 그래도 아직 확신이 안 서. 숫자로 증명해 봐 — n에 값을 하나 넣어 봐.",
  "Pilih sebuah nilai untuk n, lalu hitung 2 + 3n dan 5n. Hati-hati: jangan pilih n = 1.": "n의 값을 하나 골라 2 + 3n과 5n을 계산하세요. 조심: n = 1은 고르지 마세요.",
  "Tulis begini: “kalau n = 4 maka 2 + 3n = … sedangkan 5n = …”. Isi angkanya.": "이렇게 쓰세요: “n = 4이면 2 + 3n = …이고 5n = …이다”. 숫자를 채우세요.",
  "Aku ikut hitung. Untuk n = 4: 2 + 3×4 = 14, sedangkan 5×4 = 20. Beda jauh. Angkanya memang tidak cocok.": "나도 계산해 볼게. n = 4일 때: 2 + 3×4 = 14, 5×4 = 20. 차이가 크네. 숫자가 정말 안 맞아.",
  "Oke, aku salah. Kalau 2 + 3n benar-benar sama dengan 5n, harusnya cocok untuk <i>semua</i> nilai n, bukan cuma kebetulan satu. Dan karena 2 sudah diketahui sedangkan 3n belum, keduanya memang tidak bisa disatukan — bentuk terbuka itu sudah jawaban akhirnya. Makasih.": "알겠어, 내가 틀렸어. 2 + 3n이 정말 5n과 같다면 우연히 하나가 아니라 <i>모든</i> n에 대해 맞아야 해. 그리고 2는 알고 3n은 모르니까 둘은 정말 합칠 수 없어 — 열린 형태가 이미 최종 답이야. 고마워.",
  "Tapi 2 ikan + 3 ikan jelas 5 ikan. Kenapa huruf tidak boleh diperlakukan begitu?": "그런데 생선 2마리 + 생선 3마리는 당연히 생선 5마리잖아. 문자는 왜 그렇게 하면 안 돼?",
  "Guruku bilang jawaban harus disederhanakan. Kalau dibiarkan 2 + 3n, itu belum sederhana dong?": "선생님이 답은 간단히 해야 한다고 했어. 2 + 3n으로 두면 아직 간단히 안 한 거 아니야?",
  "Aku masih menganggap 2 dan 3n itu sejenis. Yakinkan aku kenapa tidak.": "난 아직도 2랑 3n이 같은 종류라고 생각해. 왜 아닌지 설득해 봐.",
  "Coba pakai contoh angka, mungkin aku lebih mudah paham.": "숫자로 예를 들어 봐, 그러면 더 쉽게 이해할 수 있을지도 몰라.",

  "Tulis argumen yang lebih panjang — Budi tidak bisa dibujuk dengan satu kata.": "더 긴 주장을 쓰세요 — Budi는 낱말 하나로는 설득되지 않아요.",
  "Model bahasa tidak bisa dihubungi ({e}). Budi otomatis kembali ke mesin aturan offline — media tetap berjalan.": "언어 모델에 연결할 수 없어요({e}). Budi는 자동으로 오프라인 규칙 엔진으로 돌아가요 — 매체는 계속 작동해요.",
  "Budi menerima poin itu — <b>{n} dari {t}</b> hal sudah ia terima. Masih ada yang mengganjal.": "Budi가 그 논점을 받아들였어요 — <b>{t}가지 중 {n}가지</b>를 받아들였어요. 아직 걸리는 게 있어요.",
